<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>AR 取景器 · 手机端</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden;
              font:13px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif; color:#e8eef3; }
  /* 铺满：预览按 cover 撑满整屏，多出来的两边裁掉，不留黑边 */
  #stage { position:fixed; inset:0; overflow:hidden; }
  #v, #c { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  #c { pointer-events:none; }

  #hud { position:fixed; left:10px; top:calc(10px + env(safe-area-inset-top));
         background:#00000070; border:1px solid #ffffff22; border-radius:8px;
         padding:7px 10px; font-size:11.5px; font-variant-numeric:tabular-nums;
         color:#9fb0bd; line-height:1.65; pointer-events:none; max-width:60vw; }
  #hud b { color:#7dfcff; font-weight:600; }
  #hud .warn { color:#ff8a8a; }

  /* ── 底部抽底 ────────────────────────────────────────────────────
     加了立绘控件之后，一整条面板会占掉半屏，把取景画面挤没。
     所以面板默认**收起**：只留最下面一条把手 + 快门，点把手才展开。
     展开时最多 60% 屏高，超出部分面板内部自己滚，绝不把画面顶掉。
     快门永远在把手这一条上 —— 收起状态也得能按得到，不然就没意义了。 */
  #dock { position:fixed; left:0; right:0; bottom:0; z-index:20; }
  /* 面板要不透明：大太阳下底下透出实时画面，字就读不清了 */
  #sheet { max-height:0; overflow:hidden; background:#0b0e11;
           border-top:1px solid #ffffff14; transition:max-height .22s ease;
           -webkit-overflow-scrolling:touch; }
  #sheet.open { max-height:60vh; overflow-y:auto; }
  #sheetIn { padding:10px 12px 6px; }
  #bar { display:flex; gap:8px; align-items:stretch;
         padding:8px 12px calc(8px + env(safe-area-inset-bottom));
         background:linear-gradient(#0000,#0000009c 38%); }

  /* ── 常驻滑块条 ──────────────────────────────────────────────────
     调大小的时候必须能同时看见取景画面。原来大小滑条埋在 #sheet 里，
     一展开面板就吃掉 60% 屏高，等于闭着眼调。所以把「大小 / 焦距 /
     变焦」提到这一条上：它**不随面板收放**，永远在最底下看得见。
     高度是抠出来的 —— 竖着堆三行就又把画面挡没了，所以三格**横着并排**，
     每格 = 一行「标签 + 读数」+ 一根滑块。
     ⚠ 背景必须不透明，理由同 #sheet：大太阳底下透出实时画面，字就读不清了。
     ⚠ safe-area 由最底下的 #bar 吃（它才有 env(safe-area-inset-bottom) 的内边距），
       #live 骑在它上面，永远压不到 home indicator。 */
  #live { display:flex; gap:6px; padding:3px 8px;
          background:#0b0e11b8; border-top:1px solid #ffffff14; }
  .lvCell { flex:1 1 0; min-width:0; display:flex; flex-direction:column; }
  .lvTop { display:flex; justify-content:space-between; align-items:baseline;
           gap:4px; height:13px; }
  .lvTop label { font-size:10.5px; line-height:13px; color:#9aa7b2;
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lvTop output { flex:0 0 auto; font-size:11px; line-height:13px;
                  font-variant-numeric:tabular-nums; color:#e8eef3; }
  /* 触摸目标 ≥44px：滑块本体撑满这个高度（苹果的最小值，也是手指的物理下限）。
     手指划过滑块时不许被取景画面抢走 —— 画面那边 pointerdown 会把立绘挪走。
     touch-action 顶掉浏览器的滚动/缩放手势，拖起来才跟手。
     ⚠ flex:0 0 auto 不能省：上面那条通用的 input[type=range]{flex:1} 会顺带
       把 flex-basis 设成 0%，在纵向 flex 里滑块就会被压成它的内容最小高度
       （16px），height:44 白写。这里必须显式把基准改回 auto。 */
  #live input[type=range] { display:block; flex:0 0 auto; width:100%; height:44px;
                            margin:0; touch-action:none; }
  #live input[type=range]:disabled { opacity:.45; }
  .lvNote { font-size:10px; line-height:1.2; color:#ff8a8a; }

  .row { display:flex; align-items:center; gap:9px; margin:7px 0; }
  .row label { flex:0 0 auto; width:78px; font-size:12px; color:#9aa7b2; }
  .row output { flex:0 0 auto; width:62px; text-align:right; font-size:12px;
                font-variant-numeric:tabular-nums; color:#e8eef3; }
  input[type=range] { flex:1; accent-color:#3f9fd0; height:22px; }
  .btns { display:flex; gap:7px; margin-top:9px; }
  /* 触摸目标一律 ≥44px —— 苹果人机界面指南的最小值，也是手指的物理下限 */
  .btns button, .btns .btn { flex:1; display:flex; align-items:center; justify-content:center;
                 min-height:44px; background:#1c242b; color:#c3cfd9; border:1px solid #313d47;
                 border-radius:8px; padding:11px 4px; font-size:13px; }
  .btns button.on, .btns .btn.on { background:#2b5f7d; color:#fff; border-color:#3f9fd0; }
  #bar button { flex:1; min-height:44px; border-radius:9px; font-size:14px;
                background:#1c242bb0; color:#c3cfd9; border:1px solid #313d47; }
  #bar button.on { background:#2b5f7d; color:#fff; border-color:#3f9fd0; }
  #sheetToggle { flex:1.3; }
  #shot { flex:2; background:#c2402fdd; border-color:#e05540; color:#fff; font-weight:600; }

  /* 分区标题 */
  .sec { margin:12px 0 2px; font-size:12px; color:#7dfcff; letter-spacing:.5px; }
  /* 立绘选择器：横向滚的缩略条，不竖着堆一堆按钮 */
  #chRow { display:flex; gap:8px; overflow-x:auto; padding:2px 0 6px;
           -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  #chRow button { flex:0 0 auto; width:62px; min-height:78px; padding:0; overflow:hidden;
                  display:flex; flex-direction:column; background:#141b22;
                  border:1px solid #313d47; border-radius:9px; color:#9aa7b2; }
  #chRow button.on { border-color:#3f9fd0; box-shadow:inset 0 0 0 1px #3f9fd0; color:#fff; }
  #chRow button img { width:100%; flex:1 1 auto; min-height:56px; object-fit:cover;
                      display:block; background:#0b0e11; }
  #chRow button span { flex:0 0 auto; font-size:9.5px; padding:1px 2px; max-width:100%;
                       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #fCh { display:none; }

  /* ── 面板分组 ────────────────────────────────────────────────────
     一展开就是五根滑条 + 两排按钮，用户的原话是「手忙脚乱，连我自己都不知道
     该怎么把它点下去」。所以按**做事的顺序**重排：立绘 → 摆位 → 取景；每组
     一行小字说清这组干什么；不常用的两类（修图、相机细调）收进折叠区，默认
     收起（▸），点开才见（▾）。面板本身默认收起的状态没变。 */
  .hint { margin:0 0 6px; font-size:11.5px; line-height:1.45; color:#7e8c99; }
  /* 组内的小标题：比 .sec 轻一号 —— 它属于上一组，不另起一节 */
  .sub  { margin:11px 0 5px; font-size:11.5px; color:#9aa7b2; }
  /* 折叠区：整行一个 44px 的触摸目标，▸/▾ 和面板把手用同一套符号 */
  .fold { display:flex; align-items:center; gap:6px; width:100%; min-height:44px;
          margin-top:9px; padding:11px 10px; background:#141b22; color:#c3cfd9;
          border:1px solid #313d47; border-radius:8px; font-size:13px; text-align:left; }
  .fold.on { background:#22303a; border-color:#3f9fd0; color:#fff; }
  .fold .caret { flex:0 0 auto; width:13px; font-size:12px; color:#7dfcff; }
  /* 沉底那一个：素材包是"存东西"，和上面那堆"调画面"的按钮不是一类 */
  #exPack { flex:1; background:#22303a; border-color:#3f9fd0; color:#e8eef3; }
  /* 最常用的（选立绘）就摊在最上面，缩略图也跟着放大一点 */
  #chRow button { width:72px; min-height:86px; }
  #chRow button img { min-height:62px; }

  /* ── 赞助链接：沉在面板最底下，看得见但不跟功能按钮抢注意力 ──────
     studio.html 那一版是给 326px 侧栏写的（margin 22px、padding 9/11、12px 字）。
     手机上这一条是**全宽**，左右只留面板自己的内边距 + 一圈 margin 收边，
     所以 margin 从 22px 收到 14px、不加额外左右 padding。
     ⚠ 高度按触摸目标给到 44px（它是 <a>，不归 .btns button 那条规则管）——
       手指够得着才不会点偏到旁边的按钮上。
     ⚠ 它整条在 #sheet 里，而 #sheet 有 max-height:60vh 且自己滚 ——
       内容再多也顶不到下面的常驻条（#live）和把手（#bar），
       「常驻条 ≤12% 屏高」那条约束不受影响。 */
  #sponsor { display:flex; align-items:center; flex-wrap:wrap; gap:7px;
             min-height:44px; margin:14px 0 4px; padding:9px 11px;
             border:1px solid #313d47; border-radius:9px; background:#141b22;
             color:#9aa7b2; font-size:12px; line-height:1.5; text-decoration:none; }
  #sponsor:active { border-color:#e05540; background:#1a1416; color:#e8eef3; }
  #sponsor span:first-child { color:#ff7b72; font-weight:600; }
  #sponsor .spTip { color:#7e8c99; font-size:11px; }
  #sponsor:active .spTip { color:#93a2ad; }

  /* ── 全身 / 半身：导入立绘后弹一次的二选一 ────────────────────────
     这两种立绘的锚点是**相反**的，导入之后得先知道是哪一种，才知道往哪摆：
       全身 → 脚踩地面（贴地）　半身 → 切口压在取景框边上（自由 + 贴下）
     交互上就三条：不打断流程、别遮住太久取景画面、手机上两个按钮一眼看懂。
     所以它不是整屏弹窗（那会把取景画面全挡掉、还要多点一次"确定"），
     而是一张**贴在底部常驻条上方**的小卡片：上面 2/3 屏的取景画面一动不动。
     ⚠ position:fixed 而且**不在 #dock 里** —— 放进 dock 会成为 dock 的布局高度，
       「收起时底部只剩一小条」那条约束当场破掉（测试里量过）。
     ⚠ bottom 由 JS 量常驻条 + 把手的实际高度算出来，不写死：换机型、转屏、
       字体大小变了都不会压到快门。 */
  #kind { position:fixed; left:8px; right:8px; z-index:30;
          background:#0b0e11; border:1px solid #3f9fd0; border-radius:10px;
          padding:8px 10px 9px; box-shadow:0 6px 24px #000a; }
  #kind[hidden] { display:none; }
  #kind .kdTitle { font-size:12px; line-height:1.45; color:#7dfcff; margin-bottom:7px; }
  #kind .kdRow { display:flex; gap:7px; align-items:stretch; }
  /* 触摸目标 ≥44px，和面板里那排按钮同一个标准 */
  #kind .kdRow button { flex:1 1 0; min-height:44px; border-radius:9px; font-size:14px;
                        background:#1c242bb0; color:#c3cfd9; border:1px solid #313d47; }
  #kind .kdRow button:active { background:#2b5f7d; color:#fff; border-color:#3f9fd0; }
  /* 关掉那个：不给"随便点一下就替我选了"，要的是"我这次不选" */
  #kind #kdClose { flex:0 0 auto; width:44px; font-size:15px; color:#9aa7b2; }
  #kind .kdTip { margin-top:6px; font-size:10.5px; line-height:1.45; color:#7e8c99; }

  /* ── 拖动提示：贴在取景画面上 ────────────────────────────────────
     studio.html 有一行「画面**拖动**挪立绘」，手机页一直没搬 —— 手机上根本猜不到
     画面里的立绘能拖（用户原话「半身不知道往哪移动 / 移不动」）。
     ⚠ 必须在**画面上**、不在面板里：#sheet 默认收着，提示放里面等于没有。
     ⚠ pointer-events:none 一个都不能少 —— 它骑在立绘上方，吃掉手势就成了新的"拖不动"。
     ⚠ 样式要轻：半透明胶囊 + 小字，几秒后自己淡出（JS 加 .fade 再 hidden）。
     ⚠ bottom 由 JS 量常驻条 + 把手的高度算出来，和 #kind 同一套 ——
       换机型、转屏、字大一点都不会压到快门和滑块条。 */
  #tip { position:fixed; left:50%; transform:translateX(-50%); z-index:15;
         max-width:calc(100vw - 24px); padding:5px 11px; border-radius:999px;
         background:#000000b8; border:1px solid #ffffff26; color:#e8eef3;
         font-size:11.5px; line-height:1.4; text-align:center;
         pointer-events:none; opacity:1; transition:opacity .6s ease; }
  #tip[hidden] { display:none; }
  #tip.fade { opacity:0; }

  #gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          text-align:center; padding:28px; background:#0b0e11; z-index:50; font-size:14px; }
  #gate div { max-width:340px; line-height:1.9; }
  #gate button { margin-top:18px; width:100%; padding:14px; background:#2b5f7d; color:#fff;
                 border:1px solid #3f9fd0; border-radius:9px; font-size:15px; }
  #gate .err { color:#ff8a8a; }

  /* 中 / EN 开关。放右上角，和左边那块 HUD 对称 */
  #lang { position:fixed; right:10px; top:calc(10px + env(safe-area-inset-top)); z-index:60;
          background:#00000070; border:1px solid #ffffff22; border-radius:8px;
          padding:5px 11px; font-size:12px; color:#9fb0bd; letter-spacing:.5px; }
</style>
</head>
<body>

<div id="stage">
  <video id="v" playsinline autoplay muted></video>
  <canvas id="c"></canvas>
</div>

<div id="hud" data-t="hud.init">初始化…</div>
<button id="lang" data-t-title="lang.switch">EN</button>

<div id="dock">
  <div id="sheet"><div id="sheetIn">

    <!-- ── ① 立绘：最常用的一步，摊在最上面、缩略图也最大 ────────── -->
    <div class="sec" data-t="sec.char">立绘</div>
    <div class="hint" data-t="hint.char">点一张，她就站进画面</div>
    <div id="chRow"></div>
    <div class="btns">
      <label class="btn" for="fCh"><span data-t="ch.pick">选本地图片</span></label>
      <input id="fCh" type="file" accept="image/*">
    </div>
    <!-- 修图和"选哪张立绘"不是一回事：上面那排是"用谁"，这里是"把手上这张修干净"。
         原来混在一排，看着像是"点了抠图就去挑下一张"。所以单开一个折叠区。 -->
    <button class="fold" id="foldEdit" data-t-title="fold.editTip" aria-expanded="false">
      <span class="caret" id="caretEdit">▸</span><span data-t="fold.edit">修饰立绘</span></button>
    <div id="editBox" hidden>
      <div class="btns">
        <button id="cutSolid" data-t="btn.cutSolid">纯色底抠图</button>
        <button id="trimBtn" data-t="btn.trim">自动裁边</button>
        <button id="chReset" data-t="btn.reset">还原</button>
      </div>
    </div>
    <div id="chNote" style="display:none;margin-top:6px;font-size:12px;color:#9aa7b2;line-height:1.7"></div>

    <!-- ── ② 摆位：先"站在地上还是飘在画面里"，再"这张图从哪切"，
           最后才是相机那几个数（收起来，它是细调不是第一步）──────── -->
    <div class="sec" data-t="sec.place">摆位</div>
    <div class="hint" data-t="hint.place">全身用贴地，半身用自由</div>
    <div class="btns">
      <button id="mGround" class="on" data-t="mode.ground">贴地</button>
      <button id="mFree" data-t="mode.free">自由</button>
    </div>
    <div class="row" id="szRow" style="display:none"><label data-t="row.size">占画面高</label><input type="range" id="sz" min="5" max="300" step="1" value="60"><output id="osz">60%</output></div>
    <!-- 纯大小系数：**只**改大小，位置一个像素都不动。
         和「占画面高」是一对互斥的入口：自由模式给 #sz，贴地模式给这一根。
         贴地模式下改距离/等效焦距，位置和大小会**一起**变（物理上对，但它就不是
         一个"调大小"的控件），所以那个愿望由这一根满足 —— 它乘在投影算出来的
         跨度上，锚点钉在下沿那个点，放大是从下沿往上长。 -->
    <div class="row" id="scRow"><label data-t="row.scale">大小系数</label><input type="range" id="sc" min="0.3" max="3" step="0.01" value="1"><output id="osc">1.00×</output></div>
    <!-- 景别：这张立绘是从人身上哪一段切的。贴地模式下它决定下沿落在哪个高度，
         半身立绘选对景别才不会"被当成全身放大"。 -->
    <div class="sub" data-t="place.shot" data-t-title="place.shotTip">景别</div>
    <div class="btns" id="shotRow"></div>
    <!-- 框条吸附：半身立绘是**被切掉一半**的图，切口一旦离开画框就变成一截悬空的
         躯干。所以切口那条边必须与取景框的一条边重合，沿那条边可以滑到任意位置。
         它是**自由模式下的定位方式**，不是第三种模式：自由模式决定多大（占画面高），
         贴边决定贴哪条边、沿边滑到哪。半身立绘 = 自由 + 贴边。
         ⚠ 吸附时旋转锁 0：图上歪了，贴边那条边就露缝，整条边白吸。 -->
    <div class="sub" data-t="place.edge" data-t-title="place.edgeTip">贴边</div>
    <div class="btns" id="edgeRow"></div>
    <button class="fold" id="foldCam" data-t-title="fold.camTip" aria-expanded="false">
      <span class="caret" id="caretCam">▸</span><span data-t="fold.cam">相机与距离</span></button>
    <div id="camBox" hidden>
      <div class="row"><label data-t="cam.h">相机高度</label><input type="range" id="h"  min="0.6" max="2.2"  step="0.01" value="1.60"><output id="oh">1.60m</output></div>
      <div class="row"><label data-t="cam.Hp">人物身高</label><input type="range" id="Hp" min="1.10" max="2.00" step="0.01" value="1.65"><output id="oHp">1.65m</output></div>
      <div class="row"><label data-t="cam.d">距离</label>   <input type="range" id="d"  min="0.5" max="20"   step="0.05" value="4.00"><output id="od">4.00m</output></div>
      <div class="row"><label data-t="cam.x">横向</label>   <input type="range" id="x"  min="-6"  max="6"    step="0.05" value="0"><output id="ox">0.00m</output></div>
      <div class="row"><label data-t="cam.feq">等效焦距</label><input type="range" id="fe" min="10" max="120"  step="1"    value="23"><output id="ofe">23mm</output></div>
    </div>

    <!-- ── ③ 取景：出图裁到哪 + 两根辅助线 + 最后"存东西" ─────────── -->
    <div class="sec" data-t="sec.frame">取景</div>
    <div class="hint" data-t="hint.frame">画幅决定出图裁到哪，网格/人体只是辅助线</div>
    <div class="row"><label data-t="cam.frame">取景框</label><span id="frameRead" style="font-size:12px;color:#9aa7b2"></span></div>
    <div class="btns" id="frameRow"></div>
    <div class="btns">
      <button id="tGrid" class="on" data-t="btn.grid">地面网格</button>
      <button id="tBody" class="on" data-t="btn.body">人体</button>
    </div>
    <div class="btns">
      <button id="exPack" data-t="btn.export">导出素材包</button>
    </div>
    <div id="saveNote" style="display:none;margin-top:9px;font-size:12px;color:#9aa7b2;line-height:1.7"></div>

    <!-- 赞助（爱发电）。沉在面板**最底下** —— 它是"支持这个站"，不是流程里的一步，

<script>
'use strict';
const D2R = Math.PI/180, R2D = 180/Math.PI;

// ── 真机上报（临时调试用）—— 已摘 ─────────────────────────────────
// 页面上原来有个 probe()：转屏 / 改窗口时把 win/roll/ang/框/摆位用 <img> 打到
// 服务器的 /__p 上，好让远端不用靠猜就能看到真机发生了什么。横屏那批 bug 就是靠它定位的。
// 上线摘掉了：公开站点上每次转屏都发一个请求、而 /__p 在线上并不存在（白 404）。
// 要在真机上再查一次的话，从 git 历史或日志里把这一段贴回来即可 ——
// 服务端那条口子（serve.mjs 里的 /__p）留着，本地起服务就能收。

// ── 软件转屏 ──────────────────────────────────────────────────────
/**
 * 手机横着拿、但系统「自动旋转」没开时的兜底。
 *
 * 那种状态下 screen.orientation.angle 还是 0，可陀螺仪的 roll 已经接近 ±90 ——
 * 因为相机**真的转了**，画面里的世界就歪 90°（视频、网格、骨架、立绘四个一起歪，
 * 所以它们彼此是一致的、代码没写错）。web 页面管不了屏幕转不转，
 * **只能把自己转过来**。
 *
 * 做法是转 <body>：transform 会给 position:fixed 的子元素造一个新的包含块，
 * 所以 #stage（视频+画布）、#dock（面板）、#hud、#lang 会一起转，不用一个个来。
 *
 * ⚠ 代价：横画面塞进竖屏幕，上下必然留黑边 —— 物理上屏幕就那么多像素。
 *   想要无黑边的真横屏，只有打开系统自动旋转（那时 ang≠0，这里自动不生效）。
 */
let TURN = 0;   // 当前软件转了 0 / ±90
/** 逻辑视口。软件转了 90° 时宽高互换 —— 布局得按这个算，不是按 innerWidth */
const VW = () => (Math.abs(TURN) === 90 ? innerHeight : innerWidth);
const VH = () => (Math.abs(TURN) === 90 ? innerWidth  : innerHeight);

function syncTurn(){
  const ang = (screen.orientation && screen.orientation.angle) || 0;
  const r = S.roll || 0;
  // 系统转屏了 → 交给原来那句 so===90 的补偿，这里不动
  // 阈值取 45°：45 以上才算"横过来了"，免得稍微歪一点就翻页
  const want = (ang === 0 && Math.abs(r) > 45) ? (r > 0 ? 90 : -90) : 0;
  if (want === TURN) return;
  TURN = want;
  const b = document.body;
  if (!TURN){
    b.style.cssText = '';
    for (const el of [v, cv]) el.style.transform = 'translate(-50%,-50%)';
  } else {
    // 先摆成"逻辑尺寸"再转 90° 居中 —— 转完正好盖满竖屏幕
    b.style.position = 'fixed';
    b.style.left = '50%'; b.style.top = '50%';
    b.style.width = innerHeight + 'px';
    b.style.height = innerWidth + 'px';
    b.style.transformOrigin = 'center center';
    // ⚠ 这里是 `rotate(${TURN}deg)`，**不是** rotate(-TURN)。
    //   约定的推导（roll 的定义见 onOrient）：roll = 天顶方向相对画面"上"的夹角，
    //   朝画面右为正。所以 roll=+90 ⇔ 天顶在画面右侧 ⇔ 设备的 +x 边正朝天
    //   ⇔ 用户眼里的"底"是设备的 -x 边 ⇔ body 底边（常驻条）必须转到**物理屏幕左边**。
    //   CSS 里 rotate 正角是顺时针，只有 rotate(+TURN) 才把底边送到那一侧；
    //   写成 -TURN 会整整差 180°——真机上的表现就是"上下颠倒，本来在上面的跑到下面去"。
    //   （用 _probe_orient.mjs 实测：-TURN 时 roll=+90 的常驻条落在物理屏幕右边，反的。）
    b.style.transform = `translate(-50%,-50%) rotate(${TURN}deg)`;

    //   页面里是两层，朝向各算各的：
    //     ① UI 外壳（按钮/滑条/HUD）—— 只受 body 的 CSS rotate 影响，要转 ±90 才正

    //        TURN=0 时真机验过是对的（"网格是横的"）。body 一转它就跟着歪，

    //   之前只转 body：UI 正了、世界层被多转了 90°，
    //   真机上就是"横着拿 UI 是横的、里面的世界却是竖的"（地平线立起来、骨架躺倒）。
    for (const el of [v, cv]) el.style.transform = `translate(-50%,-50%) rotate(${-TURN}deg)`;

  //   顶层看不见），所以转屏后画布**保持转屏前的尺寸** —— 它盖得住逻辑视口，
  //   viewRect 也算得对（204 条断言验过），网格也就一直是对的。
  //   真要让画布跟着重算，得先把网格/投影那条链路的坐标系理清楚，别在这里单点动。
}

/**
 * 取词。LANG === 'en' 取第 2 条，否则第 1 条。
 * 缺 key（或那条翻译还没写）时返回 **key 本身** —— 界面上冒出 read.frame
 * 这种裸 key 就是漏翻了，一眼能看见。
 */
const t = (k, ...a) => {
  const e = TXT[k];
  const s = e ? e[LANG === 'en' ? 1 : 0] : k;
  if (s === undefined || s === null) return k;
  return a.length ? a.reduce((acc, x, i) => acc.split('{' + i + '}').join(String(x)), s) : s;
};

const LANG_KEY = 'arcam.lang';
/**
 * 语言决定顺序 —— ★ 顺序不能动：
 *   ① URL 参数 ?lang=zh / ?lang=en   测试靠它把语言钉死，必须最先看。
 *      只影响**这一次加载**，绝不写 localStorage。
 *   ② localStorage 里存的选择（用户在界面上手动切过）
 *   ③ navigator.language 以 zh 开头 → zh，否则 → en
 */
function pickLang(){
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
  } catch (e){}
  try {
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  } catch (e){}
  return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
}
let LANG = pickLang();

const S = { h:1.6, Hp:1.65, d:4.0, x:0, feq:23, pitch:0, roll:0,
            // 默认满幅：出图 = 整块画布，别照可见区裁。
            // 「自由」那种裁法横屏时把画面裁成一条，全身塞不进去；
            // 可见区那块被常驻条压住的部分，靠 UI 半透明让你看得见（见 CSS）。
            grid:true, body:true, ready:false, frame:'满幅',
            // 立绘摆放：'ground' = 贴地（默认，全身立绘用），'free' = 自由（半身用）
            mode:'ground', sizePct:60,
            // 景别：这张立绘从人身上哪一段切的。老存档没有这一项 ——
            // groundPlacement 读不到就当'全身'（= 老行为，下沿踩地），不会摆歪。
            shot:'全身',
            // 纯大小系数：只乘在"这个人站在那儿该有多大"那个跨度上，**位置一点不动**。
            // 老存档没有这一项 → 读不到就是 1，和老行为逐像素等价。
            charScale:1,
            // 框条吸附：0 不贴边 / 1 上 / 2 下 / 3 左 / 4 右（和 studio.html 的编号一致）。
            // 老存档没有这一项 → 0，即不吸附，老行为。
            edgeBar:0 };

/**
 * 景别表：值 = 立绘**下沿离地高度** / 人物身高。
 *   '全身' 1.00 → 下沿在地面（脚）        '膝上' 0.72 → 下沿在膝盖（1-0.72=0.28×身高）
 *   '腰上' 0.47 → 下沿在腰（0.53×身高）     其余照此类推
 * ⚠ 和 studio.html 里的 SHOTS **逐字一致**（连 key 用中文都一样）——
 *   两边算的是同一个人站在同一块地上，抄歪一个数，手机和融图台摆出来的就对不上。
 */
const SHOTS = { '全身':1.00, '膝上':0.72, '腰上':0.47, '胸上':0.28, '头肩':0.20 };

/** 出图画幅。值 = 宽/高，0 = 不裁（用整屏看得见的那块，见 viewRect） */
// 满幅 = -1：不落在可见区里，直接吃**整块画布**。见 frameRect。
const FRAMES = { '自由':0, '1:1':1, '4:5':0.8, '16:9':16/9, '9:16':9/16, '满幅':-1 };
/**
 * 屏幕上**真正看得见**的那块画布（画布坐标）。
 *
 * 为什么非要有这一层：预览是 cover 铺满的，画布必然有一圈落在屏幕外
 * （竖屏裁左右、横屏裁上下）；屏幕最下面又被常驻滑块条 + 把手压住。
 * 取景框只要伸进这两块地方，框边就成了"用户根本看不见的线"——
 * 半身立绘「贴下」吸到那儿，屏幕上看着就是压根没吸（真机原话：
 * 「我横过来她还是站在那里」）。
 *
 * ⚠ 量的是**布局**（getBoundingClientRect + 两条常驻条的高度），不是画布自己的
 *   宽高 —— 画布分辨率是摄像头的（转屏不变），屏幕上的位置和大小才跟着转屏变。
 * ⚠ 常驻条的高度按 offsetHeight 累加、不读 #live 的 top：#sheet 展开时 #live 会被
 *   顶上去，读 top 的话框会跟着面板开合乱跳。
 * ⚠ 布局还没落定时（cv 尺寸为 0 / canvas 没被布局）退回整块画布 ——
 *   宁可大，不可算出 0×0 的框。
 */
function viewRect(){
  const W = cv.width, H = cv.height;
  if (!W || !H) return { x:0, y:0, w:W, h:H };
  // ⚠ 一律在**物理玻璃**坐标里算，再换回画布坐标。别再掺 VW()/VH()（逻辑视口）——
  //   那是**没抵消**的那一层（UI 外壳）用的框，世界层不认它。
  //   世界层（#v/#c）在 syncTurn 里被 rotate(-TURN) 抵消掉了 body 的旋转，
  //   所以它的局部 xy 轴跟物理玻璃的 xy 轴是同一套（净旋转 0），而且永远居中
  //   （#c 居中于 #stage，#stage 铺满 body，body 居中于玻璃）。
  //   常驻条那一层**没有**抵消、跟着 body 转：软转屏 ±90 时它贴在物理
  //   **左边 / 右边**，只有没转屏时才在底下 —— 这就是之前横屏下立绘压在
  //   控制/拍照 后面的原因（排的是"底边"，实际条在侧边）。
  const ow = cv.offsetWidth, oh = cv.offsetHeight;
  if (!(ow > 0) || !(oh > 0)) return { x:0, y:0, w:W, h:H };
  const kx = W/ow, ky = H/oh;                          // 画布像素 / 物理像素
  const barH = ($('live') ? $('live').offsetHeight : 0) +
               ($('bar')  ? $('bar').offsetHeight  : 0);
  const physW = innerWidth, physH = innerHeight;
  let vx0 = 0, vx1 = physW, vy0 = 0, vy1 = physH;
  if (TURN > 0)      vx0 = Math.min(barH, physW);       // 转过 +90：条贴在物理左边
  else if (TURN < 0) vx1 = Math.max(0, physW - barH);   // 转过 -90：贴在物理右边
  else               vy1 = Math.max(0, physH - barH);   // 没转屏：还在底下
  if (!(vx1 - vx0 > 1) || !(vy1 - vy0 > 1)) return { x:0, y:0, w:W, h:H };
  const toCvX = px => (px - physW/2) * kx + W/2;
  const toCvY = py => (py - physH/2) * ky + H/2;
  // ⚠ 四边都落到**整像素**上：这个矩形同时是出图的裁切原点（composeShot 里
  //   drawImage(full, -R.x, -R.y)），小数原点会让整张照片被重采样一遍 ——
  //   立绘层盖回照片时就不是逐像素对得上了（真踩过：99.9% 相同、边缘一圈 maxΔ=31）。
  const x0 = Math.round(toCvX(vx0)), x1 = Math.round(toCvX(vx1));
  const y0 = Math.round(toCvY(vy0)), y1 = Math.round(toCvY(vy1));
  return { x:x0, y:y0, w:x1-x0, h:y1-y0 };
}
/**
 * 出图矩形（画布坐标）—— 它同时是**画在屏幕上的取景框**和**贴边吸附的目标**，
 * 所以必须整块落在 viewRect 里：框边就是那条看得见的线，看不见等于没吸。
 *   自由画幅：不额外裁，直接就是看得见的那块（宽高比 = 屏幕）
 *   其余画幅：在看得见的那块里取该宽高比的最大内接矩形，居中
 */
function frameRect(){
  // 满幅：整块画布，**不**先缩进可见区。
  // 这一条是给「拍全身」用的 —— 别的画幅都只能长在看得见的那块里，
  // 横屏时那块很扁（手机没开自动旋转、软转屏之后看得见的就是一条竖长条，
  // 开了自动旋转则是一条横扁条），出图照着框一裁更扁，人整个塞不进去。
  // 代价：框边会伸到屏幕外，贴边吸附吸到那些边就看不见 —— 用满幅就别指望吸附。
  if (FRAMES[S.frame] === -1) return { x:0, y:0, w:cv.width, h:cv.height };
  const V = viewRect();
  const ar = FRAMES[S.frame] || 0;
  if (!ar) return V;
  let w = V.w, h = w/ar;
  if (h > V.h){ h = V.h; w = h*ar; }
  // 宽高保持精确（画幅比例不能因为取整就歪），原点取整（见 viewRect 那条注释）
  return { x: Math.round(V.x + (V.w-w)/2), y: Math.round(V.y + (V.h-h)/2), w, h };
}

// ── 投影（与桌面验证器同一套公式，已验证往返误差 3.6e-15）──────────
const K_LONG = 0.8*43.266/2, K_SHORT = 0.6*43.266/2;
function focal() {
  const L = Math.max(cv.width, cv.height), Sd = Math.min(cv.width, cv.height);
  const wide = L / Sd >= 4/3;
  return (wide ? (L/2)*S.feq/K_LONG : (Sd/2)*S.feq/K_SHORT);
}
function project(x, y, d) {
  const p = S.pitch*D2R, r = S.roll*D2R;
  const Zc = -y*Math.sin(p) + d*Math.cos(p);
  const Yc = -y*Math.cos(p) - d*Math.sin(p);
  if (Zc <= 0.05) return null;
  const Xr =  x*Math.cos(r) - Yc*Math.sin(r);
  const Yr =  x*Math.sin(r) + Yc*Math.cos(r);
  const F = focal();
  return { u: cv.width/2 + F*Xr/Zc, v: cv.height/2 + F*Yr/Zc };
}

// ── 传感器：deviceorientation → 相机俯角/滚转 ─────────────────────
// W3C 定义 (alpha,beta,gamma) 为「设备系 → 世界系（东北天）」的旋转矩阵。
// 后摄光轴 = 设备 -z；画面上的"上" = 设备 +y。
// 俯角 = 光轴低于水平面的角度；滚转 = 像平面相对水平线的倾角。
// ⚠ 这套符号约定只能靠真机确认，第一次用的时候看网格有没有歪向对的一侧。
function onOrient(e) {
  if (e.alpha == null || e.beta == null || e.gamma == null) return;
  if (e.absolute === false) { /* 相对朝向也能用：我们只取重力相关的分量 */ }
  const a = e.alpha*D2R, b = e.beta*D2R, g = e.gamma*D2R;
  const cA=Math.cos(a), sA=Math.sin(a), cB=Math.cos(b), sB=Math.sin(b), cG=Math.cos(g), sG=Math.sin(g);
  const R = [
    [cA*cG - sA*sB*sG, -cB*sA, cA*sG + cG*sA*sB],
    [cG*sA + cA*sB*sG,  cA*cB, sA*sG - cA*cG*sB],
    [-cB*sG,            sB,    cB*cG],
  ];
  const fwd = [-R[0][2], -R[1][2], -R[2][2]];
  const up  = [ R[0][1],  R[1][1],  R[2][1]];
  const rgt = [ R[0][0],  R[1][0],  R[2][0]];

  S.pitch = Math.asin(Math.max(-1, Math.min(1, -fwd[2]))) * R2D;

  // 世界"上"(0,0,1) 在像平面上的投影方向，与相机 up 的夹角就是滚转
  const k = fwd[2];
  let w = [-k*fwd[0], -k*fwd[1], 1 - k*fwd[2]];
  const n = Math.hypot(w[0], w[1], w[2]) || 1;
  w = [w[0]/n, w[1]/n, w[2]/n];
  S.roll = Math.atan2(rgt[0]*w[0]+rgt[1]*w[1]+rgt[2]*w[2],
                      up[0]*w[0] +up[1]*w[1] +up[2]*w[2]) * R2D;

  // 屏幕转成横向时，设备系相对画面转了 90°，滚转要跟着补
  const so = (screen.orientation && screen.orientation.angle) || 0;
  if (so === 90)       S.roll += 90;
  else if (so === 270) S.roll -= 90;
  else if (so === 180) S.roll += 180;

  syncTurn();      // 手机横着拿但系统没转屏时，自己把整个页面转过来
  draw();
}

// ── 绘制 ──────────────────────────────────────────────────────────
function draw() {
  if (!S.ready) return;
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  if (S.grid) drawGrid();
  drawHorizon();
  drawCharTo(ctx);            // 立绘站在场景里 —— 和骨架、网格同一套投影
  if (S.body) drawFigure();   // 骨架盖在立绘上，对位的时候要看得到
  drawFrame();
  hud();
  syncLive();                 // 常驻条跟着 S 走（拖画面改距离、转屏、切模式都在这里追上）
}

/**
 * 取景框：框外压暗 + 框线 + 框内三分线。压在所有内容之上 ——
 * 框外就是拍照时会被裁掉的部分。让它看起来还在，是在骗自己。
 * 自由画幅 = 整屏，没有框可画。
 */
function drawFrame(){
  const R = frameRect(), V = viewRect(), W = cv.width, H = cv.height;
  // 框正好等于"看得见的那块"（自由画幅）时，框外那一圈在屏幕上**一个像素都不露**
  // （竖屏露在左右、横屏露在上下，都被屏幕边裁掉；下面那条被常驻条压住）——
  // 画了也只有框线会露出来，等于给整屏描一圈白边，不如不画。
  if (R.x <= V.x+0.5 && R.y <= V.y+0.5 &&
      R.x+R.w >= V.x+V.w-0.5 && R.y+R.h >= V.y+V.h-0.5) return;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.58)';
  if (R.y > 0.5)       ctx.fillRect(0, 0, W, R.y);
  if (R.y+R.h < H-0.5) ctx.fillRect(0, R.y+R.h, W, H-(R.y+R.h));
  if (R.x > 0.5)       ctx.fillRect(0, R.y, R.x, R.h);
  if (R.x+R.w < W-0.5) ctx.fillRect(R.x+R.w, R.y, W-(R.x+R.w), R.h);

  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.strokeRect(R.x+1, R.y+1, R.w-2, R.h-2);

  ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i=1;i<3;i++){
    const x = R.x + R.w*i/3, y = R.y + R.h*i/3;
    ctx.moveTo(x, R.y); ctx.lineTo(x, R.y+R.h);
    ctx.moveTo(R.x, y); ctx.lineTo(R.x+R.w, y);
  }
  ctx.stroke();
  ctx.restore();
}

function gridPaths() {
  const out = [];
  for (let x = -6; x <= 6; x++) {
    const pts = []; let pen = false;
    for (let i = 0; i <= 300; i++) {
      const d = 0.3 + (i/300)*26;
      const q = project(x, -S.h, d);
      if (!q) { pen = false; continue; }
      pen ? pts.push(q) : (pts.push(null, q), pen = true);
    }
    out.push({ pts, major: x === 0 });
  }
  for (const d of [1,2,3,4,5,6,8,10,14,20]) {
    const pts = [];
    for (let i = 0; i <= 60; i++) {
      const q = project(-7 + (i/60)*14, -S.h, d);
      if (q) pts.push(q);
    }
    out.push({ pts, major: d === 5, label: d });
  }
  return out;
}
function drawGrid() {
  const paths = gridPaths();
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  for (let pass = 0; pass < 2; pass++) {
    for (const { pts, major } of paths) {
      ctx.beginPath(); let start = true;
      for (const q of pts) {
        if (q === null) { start = true; continue; }
        start ? ctx.moveTo(q.u, q.v) : ctx.lineTo(q.u, q.v);
        start = false;
      }
      if (pass === 0) { ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth = major?7:5; }
      else { ctx.strokeStyle = major ? 'rgba(120,255,255,1)' : 'rgba(90,225,255,.9)';
             ctx.lineWidth = major ? 3 : 1.8; }
      ctx.stroke();
    }
  }
  for (const { label } of paths) {
    if (label === undefined) continue;
    const q = project(-1.4, -S.h, label);
    if (!q || q.v > cv.height || q.v < 0) continue;
    ctx.font = 'bold 20px sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.strokeText(label+'m', q.u+8, q.v-8);
    ctx.fillStyle = 'rgba(120,255,255,1)';
    ctx.fillText(label+'m', q.u+8, q.v-8);
  }
  ctx.restore();
}

function drawHorizon() {
  const F = focal(), p = S.pitch*D2R, r = S.roll*D2R, tp = Math.tan(p);
  const pt = t => ({ u: cv.width/2 + F*(t*Math.cos(r) + tp*Math.sin(r)),
                     v: cv.height/2 + F*(t*Math.sin(r) - tp*Math.cos(r)) });
  const a = pt(-12), b = pt(12), lab = pt(-0.22);
  ctx.save();
  ctx.strokeStyle='rgba(255,120,120,.8)'; ctx.setLineDash([12,8]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(a.u,a.v); ctx.lineTo(b.u,b.v); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle='rgba(255,120,120,.95)'; ctx.font='22px sans-serif';
  ctx.fillText(t('horizon'), lab.u+10, lab.v-10);
  ctx.restore();
}

function drawFigure() {
  const Hp = S.Hp, yaw = 0;
  const P = (lx, ly) => project(S.x + lx, ly - S.h, S.d);
  const TOP=1.00, HEAD=0.9335, CHIN=0.867, NECK=0.855, SHLD=0.80,
        WAIST=0.61, HIP=0.53, KNEE=0.28, ANKLE=0.045, SOLE=0.0;
  const SW=0.105*Hp, HW=0.072*Hp, FW=0.048*Hp;
  const J = {
    soleL:P(-FW,SOLE), soleR:P(FW,SOLE), ankleL:P(-FW,ANKLE*Hp), ankleR:P(FW,ANKLE*Hp),
    kneeL:P(-FW*0.9,KNEE*Hp), kneeR:P(FW*0.9,KNEE*Hp),
    hipL:P(-HW,HIP*Hp), hipR:P(HW,HIP*Hp), waist:P(0,WAIST*Hp),
    shldL:P(-SW,SHLD*Hp), shldR:P(SW,SHLD*Hp), neck:P(0,NECK*Hp),
    chin:P(0,CHIN*Hp), head:P(0,HEAD*Hp), top:P(0,TOP*Hp),
    elbowL:P(-SW*1.18,0.635*Hp), elbowR:P(SW*1.18,0.635*Hp),
    wristL:P(-SW*1.30,0.445*Hp), wristR:P(SW*1.30,0.445*Hp),
  };
  const seg=(a,b,w,c)=>{ if(!a||!b) return;
    ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(a.u,a.v); ctx.lineTo(b.u,b.v); ctx.stroke(); };
  ctx.save();
  const B='rgba(255,212,121,.95)', L='rgba(255,212,121,.75)';
  seg(J.hipL,J.hipR,7,B); seg(J.shldL,J.shldR,7,B); seg(J.waist,J.neck,9,B);
  seg(J.hipL,J.kneeL,9,L); seg(J.kneeL,J.ankleL,7,L); seg(J.ankleL,J.soleL,5,L);
  seg(J.hipR,J.kneeR,9,L); seg(J.kneeR,J.ankleR,7,L); seg(J.ankleR,J.soleR,5,L);
  seg(J.shldL,J.elbowL,7,L); seg(J.elbowL,J.wristL,6,L);
  seg(J.shldR,J.elbowR,7,L); seg(J.elbowR,J.wristR,6,L);
  seg(J.neck,J.chin,6,B);
  if (J.head && J.top && J.chin) {
    const ry = Math.abs(J.top.v - J.chin.v)/2;
    ctx.strokeStyle=B; ctx.lineWidth=4;
    ctx.beginPath(); ctx.ellipse(J.head.u, J.head.v, ry*0.72, ry, 0, 0, Math.PI*2); ctx.stroke();
  }
  for (const s of [J.soleL, J.soleR]) {
    if (!s) continue;
    ctx.fillStyle='rgba(120,255,180,.95)';
    ctx.beginPath(); ctx.arc(s.u, s.v, 7, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function hud() {
  const a = project(S.x, -S.h, S.d), b = project(S.x, S.Hp - S.h, S.d);
  const px = (a && b) ? Math.abs(a.v - b.v) : 0;
  const R = frameRect();
  $('hud').innerHTML =
    t('hud.line1', S.pitch.toFixed(1), S.roll.toFixed(1)) + '<br>' +
    t('hud.line2', cv.width, cv.height, focal().toFixed(0)) + '<br>' +
    (a && b ? t('hud.person', (px/cv.height*100).toFixed(1)) :
              `<span class="warn">${t('hud.behind')}</span>`);
  $('frameRead').textContent = t('read.frame', Math.round(R.w), Math.round(R.h));
}

// ── 控件 ──────────────────────────────────────────────────────────
function bind(id, key, unit, dec, after) {
  const el = $(id), out = $('o'+id);
  const upd = () => {
    S[key] = parseFloat(el.value);
    out.textContent = S[key].toFixed(dec) + unit;
    if (after) after();          // 改大小/换画幅之后要重吸（见 resnap）
    draw();
  };
  el.addEventListener('input', upd); upd();
}
bind('h','h','m',2); bind('Hp','Hp','m',2); bind('d','d','m',2);
bind('x','x','m',2); bind('fe','feq','mm',0);

/**
 * 滑块是不是已经待在正确位置了（差不超过半个步长就算）。
 * ⚠ 别写 `el.value !== v`：range 会按自己的 step 把 value 吸附一下，
 *   于是"差一点点"会被判成不等，每帧都回写一遍，和用户手上的拖动互掐。
 */
const nearStep = (el, v, st) => Math.abs(+el.value - v) <= st / 2;

/**
 * 常驻条 ↔ 面板 的双向同步。
 * 两边是**同一份 S 状态**的两个入口，改哪边都得把另一边的滑块位置和读数追上。
 * 拖滑块时不能无条件回写 value —— 同一个值来回写会和浏览器自己的拖动打架，
 * 所以在赋值前先比一下，一样就一个字节都不动。
 * draw() 每帧末尾会调它，所以拖动画面改距离、转屏、切模式都能自动跟上。
 */
function syncLive(){
  // 「大小」这一格在两种模式下绑的是不同的量：自由 = 占画面高%，贴地 = 纯大小系数。
  // 换模式就整套换量程/步长/单位/标签 —— 这样哪种模式下这一格都是"调大小"，
  // 而不是"改距离顺带把大小改了"。
  const el = $('lvSz'), out = $('olvSz'), lab = $('lvSzLab');
  if (el && out && lab){
    const free = S.mode === 'free';
    const lo = free ? 5 : 0.3, hi = free ? 300 : 3, st = free ? 1 : 0.01;
    if (+el.min !== lo) el.min = lo;
    if (+el.max !== hi) el.max = hi;
    if (+el.step !== st) el.step = st;
    const v = free ? S.sizePct : S.charScale;
    const val = free ? v.toFixed(0) : v.toFixed(2);
    const txt = val + (free ? '%' : '×');
    if (!nearStep(el, v, st)) el.value = v;
    if (out.textContent !== txt) out.textContent = txt;
    // 标签（和它的 title）都换 key 走 t()，不在这里写死中文 ——
    // 切语言时 applyLang 会照着 dataset 再刷一遍。
    const tk = free ? 'live.size' : 'live.scale';
    if (lab.dataset.t !== tk){ lab.dataset.t = tk; lab.textContent = t(tk); }
    const tt = free ? 'live.sizeTip' : 'live.scaleTip';
    if (lab.dataset.tTitle !== tt){ lab.dataset.tTitle = tt; lab.title = t(tt); }
  }
  const fe = $('lvFe'), ofe = $('olvFe');
  if (fe && ofe){
    if (!nearStep(fe, S.feq, 1)) fe.value = S.feq;
    const s = S.feq.toFixed(0) + 'mm';
    if (ofe.textContent !== s) ofe.textContent = s;
  }
  // 「移动」这一格：只在贴边时出现。滑块映射到**真实可滑范围**，
  // 所以滑到 0 就是真到头，不是半路被夹住（图比框大时尤其明显）。
  const mvCell = $('lvMvCell'), mv = $('lvMv'), omv = $('olvMv'), mlab = $('lvMvLab');
  if (mvCell && mv && omv && mlab){
    const tr = edgeTravel();
    const on = !!tr;
    if ((mvCell.style.display !== 'none') !== on) mvCell.style.display = on ? '' : 'none';
    if (tr){
      const c = currentPlacement();
      const pos = c ? (tr.horiz ? c.u : c.v) : tr.lo;
      const t01 = tr.hi > tr.lo ? (pos - tr.lo) / (tr.hi - tr.lo) : 0.5;
      const pct = Math.max(0, Math.min(1, t01)) * 100;
      if (!nearStep(mv, pct, 0.5)) mv.value = pct;
      const s = pct.toFixed(0) + '%';
      if (omv.textContent !== s) omv.textContent = s;
      const tk = tr.horiz ? 'live.moveX' : 'live.moveY';
      if (mlab.dataset.t !== tk){ mlab.dataset.t = tk; mlab.textContent = t(tk); }
      if (mlab.dataset.tTitle !== 'live.moveTip'){ mlab.dataset.tTitle = 'live.moveTip'; mlab.title = t('live.moveTip'); }
    }
  }
}

/**
 * 贴边之后，沿那条边能滑的像素范围。
 *
 * 图比框小 → 图得留在框内；图比框大 → 反过来，让**框**被图盖住。
 * 两种情况下上下界是相反的，所以取 min/max 收成同一个区间。
 * 常驻条的「移动」滑块就映射到这个区间上 —— 滑到 0 就是真到头，不是半路被夹住。
 */
function edgeTravel(){
  const p = typeof currentPlacement === 'function' ? currentPlacement() : null;
  if (!p || !S.edgeBar) return null;
  const R = frameRect();
  // 几何走同一个 edgeGeom —— 不再自己算一遍外接盒、也不再自己判轴。
  // （自己判轴就是之前横屏那个 bug：按基准边判成"左右移"，而实际吸的是左边、该上下移。）
  const G = edgeGeom(S.edgeBar, charAspect(), p.h, charRot());
  const a = G.horiz ? (R.x + G.bw/2) : (R.y + G.bh/2);
  const b = G.horiz ? (R.x + R.w - G.bw/2) : (R.y + R.h - G.bh/2);
  return { horiz: G.horiz, R, lo: Math.min(a, b), hi: Math.max(a, b) };
}

// 常驻条的「移动」：只在贴边时出现，沿贴住的那条边滑。
// 用户原话："移了好多下才能移动一点点" —— 问题出在拖画面，所以改走滑块：
// 手指不用一直按着、也不挡视线，还能一眼看出滑到哪了。
$('lvMv').addEventListener('input', () => {
  const tr = edgeTravel();
  if (!tr || S.mode !== 'free') return;
  const t = parseFloat($('lvMv').value) / 100;
  const pos = tr.lo + (tr.hi - tr.lo) * t;
  // ⚠ 位置存在 freeP 里（归一化），不是 currentPlacement() 返回的那个临时对象 ——
  //   往临时对象上写等于没写。写完必须 resnap() 让它走一遍吸附。
  if (tr.horiz) freeP.u = pos / cv.width;
  else          freeP.v = pos / cv.height;
  resnap();
  draw();
});

// 常驻条的「大小」：自由模式写 S.sizePct（纯大小，不挪位置），
// 贴地模式写 S.charScale（也是纯大小 —— 距离/焦距那种"位置和大小一起变"的量
// 已经全部退回折叠区里的「相机与距离」了）。
$('lvSz').addEventListener('input', () => {
  const v = parseFloat($('lvSz').value);
  if (S.mode === 'free'){
    S.sizePct = v;
    $('sz').value = v; $('osz').textContent = v.toFixed(0) + '%';
    resnap();                                  // 大小变了，贴着边的那条还得贴着
  } else {
    S.charScale = v;
    $('sc').value = v; $('osc').textContent = v.toFixed(2) + '×';
    // ⚠ 这里**不碰**任何位置量（freeP / S.d / S.x）—— "纯大小"就是这个意思
  }
  draw();
});
// 常驻条的「焦距」：和面板里的 #fe 是同一个 S.feq
$('lvFe').addEventListener('input', () => {
  S.feq = parseFloat($('lvFe').value);
  $('fe').value = S.feq; $('ofe').textContent = S.feq.toFixed(0) + 'mm';
  draw();
});
// 拖常驻条上的滑块绝不能穿透到取景画面 —— 画面那边的 pointerdown 会把立绘挪走。
// 视觉上 #dock 盖在 #c 上面本来就吃得到事件，这一道是防以后有人把监听挪到 document 上。
$('live').addEventListener('pointerdown', e => e.stopPropagation());

// 出图画幅。
// ⚠ S.frame 存的一直是**中文 key**（scene.json 里也是这个值，不能改），
//   翻的只是按钮上显示的字，所以高亮判定比 dataset.v 而不是 textContent。
const frameRow = $('frameRow');
function renderFrameRow(){
  frameRow.innerHTML = '';
  Object.keys(FRAMES).forEach(name => {
    const b = document.createElement('button');
    b.textContent = t('frame.' + name);
    b.dataset.v = name;
    b.classList.toggle('on', name === S.frame);
    b.onclick = () => {
      S.frame = name;
      [...frameRow.children].forEach(x => x.classList.toggle('on', x.dataset.v === name));
      resnap();                     // 框换了，贴边那条得按新框重算
      draw();
    };
    frameRow.appendChild(b);
  });
}
renderFrameRow();

// 景别按钮。和画幅同一套写法（studio.html 也是这个套路）。
// ⚠ S.shot 存的一直是**中文 key**（scene.json 里也是这个值，不能改），
//   翻的只是按钮上显示的字 —— 所以高亮判定必须比 dataset.v，
//   比 textContent 在英文下会全部失灵。
const shotRow = $('shotRow');
function renderShotRow(){
  if (!shotRow) return;
  shotRow.innerHTML = '';
  Object.keys(SHOTS).forEach(name => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = t('shot.' + name);
    b.dataset.v = name;
    b.onclick = () => {
      S.shot = name;
      [...shotRow.children].forEach(x => x.classList.toggle('on', x.dataset.v === name));
      draw();
    };
    b.classList.toggle('on', name === S.shot);
    shotRow.appendChild(b);
  });
}
renderShotRow();

/**
 * 框条按钮。0 不贴边 / 1 上 / 2 下 / 3 左 / 4 右 —— 编号和 studio.html 的 EDGES 一致。
 * ⚠ 存的一直是**编号**（scene.json 里也是它），翻的只是按钮上显示的字，
 *   所以高亮判定必须比 dataset.bar，比文字在英文下会全部失灵。
 */
const EDGES = [['不贴边',0],['贴上',1],['贴下',2],['贴左',3],['贴右',4]];
const edgeRow = $('edgeRow');
function renderEdgeRow(){
  if (!edgeRow) return;
  edgeRow.innerHTML = '';
  EDGES.forEach(([label, bar]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = t('edge.' + label);
    b.dataset.v = label;          // 中文 key，和 studio 一致
    b.dataset.bar = bar;
    b.classList.toggle('on', bar === S.edgeBar);
    b.onclick = () => setEdgeBar(bar);
    edgeRow.appendChild(b);
  });
}
/**
 * 换框条。保留当前大小，沿条方向的比例带过去 —— 从下边切到左边，
 * 原来在下边滑到 30% 处，切完就在左边 30% 处（照抄 studio.html 的 setEdgeBar）。
 *
 * 从「不贴边」切进来时（旧条是 0）改用新条那条轴上的当前位置：
 * 拖到哪儿就贴哪儿，只把另一条轴吸住。这两条合起来才符合直觉，
 * 否则点「贴上」会把立绘横着弹到别处。
 *
 * ⚠ 吸附是**自由模式**下的定位方式（半身立绘 = 自由 + 贴边）。在贴地模式下点它，
 *   顺手切到自由 —— 贴地那一套位置是投影算出来的，吸不了，按了没反应最糟。
 */
function setEdgeBar(bar){
  const old = S.edgeBar;
  S.edgeBar = bar;
  // ⚠ 先按"旧条"算完位置，**再**切模式 —— 切模式会走 syncModeRow → resnap()，
  //   那一下是按**新**条吸的，抢在前面就把"沿边滑到哪儿"这个比例洗掉了。
  if (chCanvas && bar){
    const R = frameRect();
    const cur = freeRaw();
    const r = (old ? slideRatio(cur, old, R) : null)
           ?? slideRatio(cur, bar, R) ?? 0.5;
    const tt = Math.min(1, Math.max(0, r));
    const c = { u: cur.u, v: cur.v, h: cur.h };
    if (bar === 1 || bar === 2) c.u = R.x + tt*R.w;
    else                        c.v = R.y + tt*R.h;
    const s = snapToEdge(c, bar, R, charAspect());
    freeP.u = s.u/cv.width; freeP.v = s.v/cv.height;
  }
  if (bar && S.mode !== 'free'){ S.mode = 'free'; syncModeRow(); }
  renderEdgeRow();
  draw();
  // 换贴边 = 换了一套"能拖的方式"（贴边沿框边滑 / 不贴边随便挪）→ 再闪一下。
  // ⚠ 只在**换过**的时候闪：手指在画面上一路拖会连续触发 setEdgeBar 吗？不会 ——
  //   拖动走 freeMove，不发这里（点了按钮才走）。所以不会一边拖一边弹。
  if (old !== bar && chCanvas) showTip();
}
renderEdgeRow();

/**
 * 折叠区：默认**收起**（面板本来就默认收起，里面再摊开一堆等于白收）。
 * 状态用 ▸ / ▾ 表示，和底部那个「控制」把手同一个符号语言。
 * 收起走 hidden 属性（整块 display:none），不是只藏可见性 —— 收起时里面的
 * 控件高度为 0，既不占位，也不会被"可点元素都要 ≥44px"这类检查当成摆在那的按钮。
 */
function bindFold(btnId, boxId, caretId){
  const b = $(btnId), box = $(boxId), car = $(caretId);
  if (!b || !box) return;
  const set = open => {
    box.hidden = !open;
    b.classList.toggle('on', open);
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (car) car.textContent = open ? '▾' : '▸';
  };
  b.onclick = () => set(box.hidden);
  set(false);
}
bindFold('foldEdit', 'editBox', 'caretEdit');
bindFold('foldCam',  'camBox',  'caretCam');

$('tGrid').addEventListener('click', e => { S.grid = !S.grid; e.target.classList.toggle('on', S.grid); draw(); });
$('tBody').addEventListener('click', e => { S.body = !S.body; e.target.classList.toggle('on', S.body); draw(); });

// ── 抽底：默认收起，点把手才展开 ──────────────────────────────────
// 收起时只占最下面一条（把手 + 快门），取景画面永远是满的。
let sheetOpen = false;
$('sheetToggle').onclick = () => {
  sheetOpen = !sheetOpen;
  $('sheet').classList.toggle('open', sheetOpen);
  $('sheetToggle').classList.toggle('on', sheetOpen);
  $('ctlArrow').textContent = sheetOpen ? '▾' : '▴';
};

// ── 立绘：装载 / 抠图 / 裁边 / 摆位 ────────────────────────────────
/**
 * 素材清单来自 chars/chars.js（普通 script，window.ARCAM_CHARS）。
 * ⚠ file 是**相对站点根目录**的（chars/立绘/xx.jpg），而这一页在 phone/ 子目录里 ——
 *   拼 URL 必须补 './'，少这一下全是 404。
 */
const LIB = window.ARCAM_CHARS || { characters: [], backgrounds: [] };
const CUT = window.ARCAM_CUT || null;   // cutout.js 没加载上也不至于整页炸

/**
 * 三张图，分工不能混：
 *   chOrig   载入的原图，「还原」回它
 *   chBase   当前**基准**。抠图会更新它（和 studio 一样：抠完的结果成为新的基准），
 *            裁边则**每次都从它重算** —— 绝不叠在裁过的结果上，否则越裁越小回不去
 *   chCanvas 真正拿去画的那张
 */
let chOrig = null;
let chBase = null;
let chCanvas = null;
let chName = '';
let chSel = -1;
const MAXCH = 1400;    // 长边先缩到这个尺寸再处理，和 studio 保持一致

/** 自由模式的图心存**归一化**坐标（0~1），换尺寸/转屏都不会跑掉 */
const freeP = { u: 0.5, v: 0.6 };

const copyOf = src => {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
};
function chNote(s){
  const el = $('chNote'); if (!el) return;
  el.innerHTML = s || '';
  el.style.display = s ? '' : 'none';
}

/** 把一张图变成基准画布。之后抠图 / 裁边全部从基准出发，绝不叠在处理过的结果上 */
function setCharset(img){
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
  const k = Math.min(1, MAXCH/Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(sw*k));
  c.height = Math.max(1, Math.round(sh*k));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  chOrig = c;
  chBase = copyOf(c);
  chCanvas = copyOf(c);
}

function loadChar(url, name, idx){
  chName = name; chSel = idx; syncChRow();
  chNote(t('note.chLoad'));
  // 导入之后先问一句「全身还是半身」—— 素材库点选和本地文件这两条路都汇到这里，
  // 所以挂在这儿一处就够，两条路都弹。**只是问，不改任何状态**：
  // 用户不选直接关掉的话，S 一个字节都不动（老行为原样，不会摆歪）。
  showKind();
  const img = new Image();
  img.onload = () => {
    setCharset(img);
    chNote(t('note.chLoaded', name, img.naturalWidth, img.naturalHeight) + '<br>' + t('note.chHint'));
    draw();
    // 选择器还开着就先不弹（两张卡片会叠在同一处）—— 等选完那一句里再弹
    if (!kindEl || kindEl.hidden) showTip();
  };
  img.onerror = () => { chBase = chCanvas = null; chNote(t('note.chFail')); draw(); };
  img.src = url;
}

// ── 全身 / 半身：导入立绘之后，先把**默认走哪条路**定下来 ────────────
/**
 * 用户原话「导入照片导入之后要选是半身还是全身」。为什么要先问：
 * 这两种立绘的锚点是**相反**的 ——
 *   · 全身 → 脚踩地面：贴地模式，下沿落在投影算出来的地面那个点上
 *   · 半身 → 切口压在取景框边上：自由模式 + 贴下（bar=2），
 *            切口那条边与画框下边精确重合（截图时不会被切掉一截悬空的躯干）
 * 半身立绘要是还按贴地摆，等于把"腰以上"当成一整个人放大塞进画面 —— 又大又错位。
 *
 * ⚠ 它只设**默认值**，不是锁死：「摆位」里的贴地/自由、五个景别、五个贴边
 *   按钮照旧能改（这里一个控件的 disabled 都不碰）。
 * ⚠ 不选直接关掉 = 一个数都不改 S，立绘照旧能用，不报错、不卡住。
 */
const kindEl = $('kind');

/** 弹出来。位置骑在常驻条 + 把手上面 —— 高度是**量**出来的，不写死 */
function showKind(){
  if (!kindEl) return;
  const lv = $('live'), bar = $('bar');
  const off = (lv ? lv.getBoundingClientRect().height : 0) +
              (bar ? bar.getBoundingClientRect().height : 0) + 10;
  kindEl.style.bottom = Math.round(off) + 'px';
  kindEl.hidden = false;
}
function hideKind(){ if (kindEl) kindEl.hidden = true; }

// ── 画面上的拖动提示 ────────────────────────────────────────────────
/**
 * 什么时候弹：**刚有东西可拖的时候**，不是每帧。
 *   · 点完「全身 / 半身」（这时才第一次摆好，最需要知道"还能拖"）
 *   · 载入立绘但选择器已经被关掉（用户按了 ✕，立绘照旧能用，一样得提示）
 *   · 换贴边（能拖的方式变了：贴边=沿框边滑，不贴边=随便挪）→ 再闪一下
 * 几秒后自己淡出：它是**提示**不是控件，不该一直杵在画面上挡视线。
 */
const TIP_MS = 3600, TIP_FADE = 600;
let tipTimer = 0, tipGone = 0;
const tipKey = () => S.edgeBar ? 'tip.slide' : 'tip.move';
function showTip(){
  const el = $('tip'); if (!el) return;
  // 高度量出来，不写死：常驻条 + 把手多高，它就骑在多高上面（和 #kind 同一套）
  const lv = $('live'), bar = $('bar');
  const off = (lv ? lv.getBoundingClientRect().height : 0) +
              (bar ? bar.getBoundingClientRect().height : 0) + 10;
  el.style.bottom = Math.round(off) + 'px';
  el.textContent = t(tipKey());          // 文案跟着当前贴边状态走（不是写死一条）
  el.classList.remove('fade');
  el.hidden = false;
  clearTimeout(tipTimer); clearTimeout(tipGone);
  tipTimer = setTimeout(() => {
    el.classList.add('fade');
    tipGone = setTimeout(() => { el.hidden = true; }, TIP_FADE + 100);
  }, TIP_MS);
}

/**
 * 把面板里那两根大小滑块和读数追上 S。
 * ⚠ 必须有这一道：applyCharKind 是**直接写 S** 的，而 #sz / #sc 只在用户
 *   拖它们时（bind 的 input）才反过来写 S —— 不补这一下，滑条位置和立绘对不上。
 */
function syncSizeSliders(){
  const sz = $('sz'), osc = $('osc'), sc = $('sc');
  if (sz){ sz.value = S.sizePct; }
  if ($('osz')) $('osz').textContent = S.sizePct.toFixed(0) + '%';
  if (sc){ sc.value = S.charScale; }
  if (osc) osc.textContent = S.charScale.toFixed(2) + '×';
}

/** 选了之后：立刻按那条路把立绘摆好，再给一句回执点名刚才那一下做了什么 */
function applyCharKind(kind){
  const half = kind === 'half';
  if (half){
    S.mode = 'free';        // 切口压在框边上，不是踩地
    S.edgeBar = 2;          // 贴下 ← 半身立绘的切口就压在这一条上
    S.sizePct = 60;         // 一个合理的初始大小，之后拖「大小」随便改
    // ⚠ 半身必须配「自由」：它的语义是"切口压在**框的下边**"，那条边得看得见。
    //   配满幅的话框下边 = 画布下边，在屏幕外（竖屏下比可见区低 159px）——
    //   切口直接沉到看不见的地方，看着就像没摆。
    S.frame = '自由';
  } else {
    S.mode = 'ground';      // 脚踩地面
    S.shot = '全身';        // 整张图从头顶到脚，下沿就是地面
    S.edgeBar = 0;          // 贴地模式下贴边没意义（位置是投影算出来的）
    // 全身配满幅：全靠整块画幅才有地方站下一个人（横屏尤其）
    S.frame = '满幅';
  }
  renderFrameRow();         // 画幅高亮跟着走 —— 上面直接写了 S.frame，不刷就是旧的
  syncSizeSliders();
  syncModeRow();            // 两根滑条的显隐 + 自由模式下把贴边补上（resnap）
  renderShotRow();          // 景别高亮跟着 S.shot 走
  renderEdgeRow();          // 贴边高亮跟着 S.edgeBar 走
  resnap();                 // 幂等，贴地模式下直接返回
  draw();                   // 立刻生效：这一帧就是新路径摆出来的样子
  chNote(t(half ? 'kind.doneHalf' : 'kind.doneFull'));
  hideKind();
  showTip();                // 摆好之后才谈得上拖 —— 提示在这儿第一次露面最合时
}

if (kindEl){
  $('kdFull').onclick  = () => applyCharKind('full');
  $('kdHalf').onclick  = () => applyCharKind('half');
  $('kdClose').onclick = () => hideKind();          // 不选 = 什么都不改
  // 卡片上的点击绝不能穿透到取景画面去（那边 pointerdown 会把立绘挪走）
  kindEl.addEventListener('pointerdown', e => e.stopPropagation());
}

function syncChRow(){
  const row = $('chRow'); if (!row) return;
  [...row.children].forEach((b, i) => b.classList.toggle('on', i === chSel));
}
/** 横向缩略条。竖着堆一排按钮会把面板撑爆，横着滚才放得下 */
function renderChRow(){
  const row = $('chRow'); if (!row) return;
  row.innerHTML = '';
  LIB.characters.forEach((it, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.title = it.name;
    b.dataset.idx = i;
    const im = document.createElement('img');
    im.alt = it.name;
    im.src = './' + it.file;          // ← 相对站点根目录，必须补 ../
    const sp = document.createElement('span');
    sp.textContent = it.name;
    b.appendChild(im); b.appendChild(sp);
    b.onclick = () => loadChar('./' + it.file, it.name, i);
    b.classList.toggle('on', i === chSel);
    row.appendChild(b);
  });
}
renderChRow();

$('fCh').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) loadChar(URL.createObjectURL(f), f.name, -1);
});

$('cutSolid').onclick = () => {
  if (!chBase) return chNote(t('note.chNone'));
  if (!CUT)    return chNote(t('note.chFail'));
  const c = copyOf(chBase);
  const r = CUT.cutSolidBg(c, { tol: 32, feather: 1.2 });
  if (r === null){ chNote(t('note.notSolid')); return; }
  chBase = c;                       // 抠完的结果成为新的基准（裁边接着从它来）
  chCanvas = copyOf(c); draw();
  chNote(t('note.cutSolid', (r*100).toFixed(0)));
};
/** 自动裁边：贴边靠的是整张图的边界，四周那圈透明边距不裁掉，贴的就不是人 */
$('trimBtn').onclick = () => {
  if (!chBase) return chNote(t('note.chNone'));
  if (!CUT)    return chNote(t('note.chFail'));
  const c = copyOf(chBase);         // 每次都从基准重来 —— 连按不会越裁越小
  const r = CUT.contentBounds(c, 8);
  if (!r){ chNote(t('note.allTrans')); return; }
  if (r.w >= c.width-1 && r.h >= c.height-1){ chNote(t('note.noMargin')); return; }
  chCanvas = CUT.cropToCanvas(c, r).canvas;
  draw();
  chNote(t('note.trimmed', c.width, c.height, chCanvas.width, chCanvas.height));
};
$('chReset').onclick = () => {
  if (!chOrig) return chNote(t('note.chNone'));
  chBase = copyOf(chOrig); chCanvas = copyOf(chOrig); draw();
  chNote(t('note.chReset'));
};

/**
 * 贴地摆位：立绘的**下沿落在景别那个高度上**，上沿顶在头顶那个点上。
 * （上沿那个位置说的是"投影算出来的跨度"；乘了大小系数 charScale 之后，
 *   下沿那个锚点仍然一个像素都不动，只是从那儿往上长/缩。）
 *   · 全身立绘：下沿 = 地面（yb = 0），和以前一模一样，一个像素都没挪
 *   · 半身立绘：下沿是**切口**不是脚，画里根本没有脚。要是还把它钉在地面，
 *     等于把"腰以上"当成一整个人放大摆进去 —— 又大又错位（用户原话
 *     「半身还是不尽人意」）。所以下沿按景别抬到膝盖/腰那个高度：
 *       yb = (1 - SHOTS[shot]) × 身高      膝上 → 0.28×身高（正好是膝盖）
 *     人往前走的时候，立绘跟着那块地面一起上移、一起变大 —— 透视才是对的，
 *     不用切自由模式，也不用手动调。
 * ⚠ 这里的 project 必须和 drawFigure() 用的是同一个 —— 换公式立绘就跟骨架对不上。
 *   project 在点落到相机后方时返回 null，下沿和头顶**两条都得判**。
 */
function groundPlacement(){
  if (!chCanvas) return null;
  const k = SHOTS[S.shot] || SHOTS['全身'];    // 老存档没 shot → 当全身
  const yb = (1 - k) * S.Hp;                   // 下沿离地多高
  const pb = project(S.x, yb - S.h, S.d);      // 下沿那个点
  const pt = project(S.x, S.Hp - S.h, S.d);    // 头顶那个点（不随景别变）
  if (!pb || !pt) return null;
  const span = Math.hypot(pb.u-pt.u, pb.v-pt.v);   // 这个人站在那儿"本来"该多大
  if (span < 2) return null;
  const h = span * S.charScale;                // ← 纯大小系数乘在这儿
  const ux = (pt.u-pb.u)/span, uy = (pt.v-pb.v)/span;   // pb→pt 的单位方向（画面系）
  return {
    // ★ 锚点 = pb（下沿那个点），不是中心。中心从 pb 沿 pb→pt 推 h/2。
    //   放大时从下沿往上长：全身立绘脚不乱跑，半身立绘切口不乱跑。
    //   锚在中心会上下都长，看着就"位置动了" —— 那正是要避免的。
    //   charScale=1 时 h === span，中心落回 (pb+pt)/2，和改之前逐像素等价。
    u: pb.u + ux*h/2, v: pb.v + uy*h/2, h,
    w: h * chCanvas.width / chCanvas.height,   // 宽高同一个比例，绝不各向异性
    // 手机横过来（roll≠0）时地面铅垂线在画面里是斜的，立绘得跟着斜。
    // 局部 -y 要对上 pb→pt：θ = atan2(ux, -uy)，即 atan2(dx, dy) 的补角。
    // 这样反推回去，下沿正好落在 pb、上沿正好落在 pb 沿方向推 h 的地方。
    rot: Math.atan2(ux, -uy),
  };
}

/**
 * 框条吸附。**照抄 studio.html**（那边被 verify/10_frame_snap.mjs 的 10.6 万组
 * 随机用例冲过），三条不变量：
 *   A 贴住的那条轴**精确**落在框边上，不是"接近"
 *   B 另一条轴整体留在框内（图比框还大时居中，那是允许的）
 *   C 幂等 —— 反复吸附不会再漂
 * 把整块画布当框传进来（{0,0,W,H}）就退化成"贴画面边"那版。
 * ⚠ 到单位置的 clamp 别写成 h < 2 这种门槛（studio 那边特意注了）——
 *   矮立绘会整个溜出吸附，看着就是"点了没反应"。
 */
/**
 * 贴边要用的全部几何，**一处算清**。
 *
 *   盒子 bw×bh —— 旋转后的外接盒。立绘转了之后它占的就是这块地方；
 *                 拿没转的 w/h 去贴，90° 时会差出整整一个身位。
 *   eff        —— 实际要吸的那条边。切口朝向变了，边也得跟着换（rotateBar）。
 *   horiz      —— 沿那条边滑是左右还是上下。滑块靠它决定写 freeP.u 还是 .v。
 *
 * ★ 为什么必须收成一处：`snapToEdge`（定位）和 `edgeTravel`（滑块行程）都要这些值。
 *   之前两边各算各的 —— 我改了吸附的旋转处理、忘了滑块，真机上就出现
 *   「横屏下移动条完全没反应、还顶在 100%」。一个改动两处消费方，只改一处必炸。
 */
function edgeGeom(baseBar, ar, h, rot){
  rot = rot || 0;
  const w = h * ar;
  const ac = Math.abs(Math.cos(rot)), as = Math.abs(Math.sin(rot));
  const bw = w*ac + h*as;
  const bh = w*as + h*ac;
  const eff = rotateBar(baseBar, rot);
  return { w, h, bw, bh, eff, horiz: (eff === 1 || eff === 2) };
}

function snapToEdge(c, bar, R, ar, rot){
  const h = c.h;
  if (!(h > 0)) return c;
  const G = edgeGeom(bar, ar, h, rot);
  const { bw, bh } = G;
  bar = G.eff;                 // 切口朝向变了 → 换一条边吸
  /**
   * 沿自由轴的位置钳位。两端不排序，谁大谁小自己认。
   *
   * 图比框小 → 正常钳在框内（两边都不出框）。
   * 图比框大 → 范围自然反过来，变成"让框始终被图盖住"，于是图能自由平移。
   *
   * ⚠ 别写成 studio.html 那版 `hi < lo ? (lo+hi)/2 : ...` —— 那在"图比框大"
   *   时会**把位置钉死在框的正中心**，一次性的吸附看不出来，但放在能拖的
   *   手机上就是"拖了半天纹丝不动"。实测：立绘 942 宽、竖屏框只有 500 宽，
   *   左界 R.x+471 比右界 R.x+29 还大 → 每拖一下都被拽回中间。
   */
  const fit = (v, a, b) => {
    const lo = Math.min(a, b), hi = Math.max(a, b);
    return Math.min(hi, Math.max(lo, v));
  };
  switch (bar){
    case 1: return { u: fit(c.u, R.x + bw/2, R.x+R.w - bw/2), v: R.y + bh/2,               h };
    case 2: return { u: fit(c.u, R.x + bw/2, R.x+R.w - bw/2), v: R.y + R.h - bh/2,         h };
    case 3: return { u: R.x + bw/2,       v: fit(c.v, R.y + bh/2, R.y+R.h - bh/2),         h };
    case 4: return { u: R.x + R.w - bw/2, v: fit(c.v, R.y + bh/2, R.y+R.h - bh/2),         h };
    default: return c;
  }
}
/** 立绘沿框条滑到哪儿了（0~1）。bar=0 返回 null —— 和 studio.html 同一套 */
function slideRatio(c, bar, R){
  if (bar === 1 || bar === 2) return (c.u - R.x)/R.w;
  if (bar === 3 || bar === 4) return (c.v - R.y)/R.h;
  return null;
}
/** 立绘自己的宽高比 */
const charAspect = () => chCanvas ? chCanvas.width/chCanvas.height : 1;
/** 立绘角度：吸附时锁 0 —— 图上歪了，贴边那条边就露缝，整条边白吸（studio 同款） */
/**
 * 立绘的朝向 = 世界里"竖直"在画面里的样子 = 滚转。
 * **和骨架、网格、地平线用同一套** —— 场景转它也转。
 *
 * ⚠ 这里原来写的是 `S.edgeBar ? 0 : S.roll*D2R`，吸附时硬锁 0。
 *   那是错的：骨架跟着 roll 转、立绘不转，两者直接脱钩（横屏一眼就看出来）。
 *   正确做法不是"锁住立绘"，而是**让吸附跟着旋转走** ——
 *   见 rotateBar()：立绘转过去之后，切口朝哪条边就吸哪条边。
 */
const charRot = () => S.roll*D2R;

/**
 * 把基准边按旋转量转过去 —— 切口朝向变了，要吸的边也得换。
 * 画面坐标系 y 朝下，正向旋转是顺时针，所以「下」转过 +90° 变成「左」：
 *   下(2) → 左(3) → 上(1) → 右(4) → 下(2)
 */
function rotateBar(bar, rot){
  const q = ((Math.round(rot / (Math.PI/2)) % 4) + 4) % 4;
  if (!q) return bar;
  const order = [2, 3, 1, 4];
  const i = order.indexOf(bar);
  return i < 0 ? bar : order[(i + q) % 4];
}

/** 自由模式下"没吸之前"的位置（归一化 freeP → 画布像素 + 当前大小） */
function freeRaw(){
  return { u: freeP.u*cv.width, v: freeP.v*cv.height, h: S.sizePct/100*cv.height };
}
/**
 * 吸附开着就把结果写回 freeP。
 * 所有动过 freeP / 大小 / 画幅的地方都得过这一道 —— 否则 freeP 停在旧位置，
 * 下一次拖动的手指偏移是从旧位置算的，立绘会先跳一下再跟手。
 * （吸附本身幂等，所以写回是安全的：再吸一次结果一模一样。）
 */
function resnap(){
  if (!S.edgeBar || !chCanvas || !cv.width) return;
  // ⚠ 旋转量必须一起传 —— 漏掉的话这里按 rot=0 算一遍外接盒，算出来的位置又写回 freeP，
  //   把调用方刚写进去的值**原地覆盖**：滑条拉到底，freeP 被改成"没转过的"那个位置，
  //   最后 freePlacement() 再按 rot=90 吸附回同一点 → 立绘纹丝不动，只有滑条在动。
  //   （用户原话："他就是在那个滑条动"；竖屏 rot=0 时两条路径恰好一致，所以竖屏是好的。）
  const s = snapToEdge(freeRaw(), S.edgeBar, frameRect(), charAspect(), charRot());
  freeP.u = s.u/cv.width; freeP.v = s.v/cv.height;
}

/**
 * 自由模式（半身立绘）：下沿是切口不是脚，贴地没意义，改成占画面高 % + 可拖的图心。
 * 贴边开着时，位置改由框条决定（自由模式决定**多大**，贴边决定**贴哪条边、沿边滑到哪**）——
 * 这不是第三种模式，就是自由模式的定位方式。
 */
function freePlacement(){
  if (!chCanvas) return null;
  const c = freeRaw();
  // 把当前的旋转量一起传进去 —— 立绘转到哪，切口就朝哪条边
  const s = S.edgeBar ? snapToEdge(c, S.edgeBar, frameRect(), charAspect(), charRot()) : c;
  return {
    u: s.u, v: s.v, h: s.h,
    w: s.h * charAspect(),
    rot: charRot(),         // 世界里的"竖直"在画面里就斜 roll 这么多；吸附时锁 0
  };
}
function currentPlacement(){ return S.mode === 'free' ? freePlacement() : groundPlacement(); }

/** 把立绘画到任意一块 context 上。取景器和出图走**同一条**，位置才分毫不差 */
function drawCharTo(g){
  const c = currentPlacement();
  if (!c || !chCanvas) return;
  g.save();
  g.translate(c.u, c.v);
  g.rotate(c.rot);
  g.drawImage(chCanvas, -c.w/2, -c.h/2, c.w, c.h);
  g.restore();
}

function syncModeRow(){
  $('mGround').classList.toggle('on', S.mode !== 'free');
  $('mFree').classList.toggle('on', S.mode === 'free');
  const free = S.mode === 'free';
  $('szRow').style.display = free ? '' : 'none';    // 自由：占画面高%；贴地：尺寸由投影定
  $('scRow').style.display = free ? 'none' : '';    // 贴地：纯大小系数（自由模式下它没意义）
  if (free) resnap();                               // 切进自由模式时把已有的贴边补上
  syncLive();                                       // 常驻条那一格的量程/标签跟着换
}
$('mGround').onclick = () => { S.mode = 'ground'; syncModeRow(); draw(); };
$('mFree').onclick   = () => { S.mode = 'free';   syncModeRow(); draw(); };
syncModeRow();
bind('sz','sizePct','%',0, resnap);   // 改大小要重吸，否则贴着边的那条边会离框
bind('sc','charScale','×',2);         // 纯大小：位置量一个都不碰

// 拖动画面 = 把人物摆到那块地面
function place(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  const u = (clientX - r.left)/r.width * cv.width;
  const vv = (clientY - r.top)/r.height * cv.height;
  const p = S.pitch*D2R, rl = S.roll*D2R, F = focal();
  const up = u - cv.width/2, vp = vv - cv.height/2;
  const A = (up/F)*Math.cos(rl) + (vp/F)*Math.sin(rl);
  const B = -(up/F)*Math.sin(rl) + (vp/F)*Math.cos(rl);
  const den = Math.sin(p) + B*Math.cos(p);
  if (Math.abs(den) < 1e-6) return;
  const d = S.h*(Math.cos(p) - B*Math.sin(p))/den;
  if (d <= 0.05) return;
  const Zc = S.h*Math.sin(p) + d*Math.cos(p);
  S.d = Math.min(20, Math.max(0.5, d));
  S.x = Math.min(6, Math.max(-6, A*Zc));
  $('d').value = S.d; $('od').textContent = S.d.toFixed(2)+'m';
  $('x').value = S.x; $('ox').textContent = S.x.toFixed(2)+'m';
  draw();
}
/** 屏幕坐标 → 画布像素坐标 */
function localPt(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return [ (clientX-r.left)/r.width*cv.width, (clientY-r.top)/r.height*cv.height ];
}
/** 点是不是落在立绘身上（转回立绘局部坐标再比） */
function inChar(u, vv){
  const c = currentPlacement();
  if (!c) return false;
  const du = u-c.u, dv = vv-c.v;
  const ca = Math.cos(-c.rot), sa = Math.sin(-c.rot);
  return Math.abs(du*ca - dv*sa) <= c.w/2 && Math.abs(du*sa + dv*ca) <= c.h/2;
}
/**
 * 自由模式：拖立绘挪位置，存归一化坐标。
 * 贴边开着时**实时重吸** —— 手指沿哪条边滑，它就跟到那条边的哪个位置；
 * 垂直于那条边的分量被吸附吃掉（这正是"贴住"的意思）。
 */
function freeMove(clientX, clientY){
  const r = cv.getBoundingClientRect();
  freeP.u = Math.min(1, Math.max(0, (clientX-r.left)/r.width));
  freeP.v = Math.min(1, Math.max(0, (clientY-r.top)/r.height));
  resnap();
  draw();
}
let dragging = false, dragChar = false;
/**
 * 手指按下时到**图心**的偏移（归一化）。拖拽全程带着这个偏移走。
 * ⚠ 别写成「图心直接跟到手指上」：那样手指一碰上去图心就瞬移到指尖，
 *   立绘当场跳一下 —— 用户抱怨的「一碰它就变换地方」就是这一下。
 *   记住偏移再拖，光碰不动则一个像素都不变。
 * ⚠ 画面上的拖动**只挪位置**（freeP），尺寸一律只走滑块，这里不碰 sizePct。
 */
const dragOff = { u:0, v:0 };
cv.addEventListener('pointerdown', e => {
  dragging = true; dragChar = false;
  // 自由模式下点在立绘身上 = 拖立绘；点别处还是"把人摆到那块地面"
  if (S.mode === 'free' && chCanvas){
    const p = localPt(e.clientX, e.clientY);
    if (inChar(p[0], p[1])){
      dragChar = true;
      const r = cv.getBoundingClientRect();
      dragOff.u = freeP.u - (e.clientX - r.left)/r.width;
      dragOff.v = freeP.v - (e.clientY - r.top)/r.height;
      return;                       // ← 先别动 freeP：碰一下不该让立绘跳走
    }
  }
  place(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  if (dragChar){
    const r = cv.getBoundingClientRect();
    freeMove(e.clientX + dragOff.u*r.width, e.clientY + dragOff.v*r.height);
  } else place(e.clientX, e.clientY);
});
cv.addEventListener('pointerup',   () => { dragging = false; dragChar = false; });
cv.style.pointerEvents = 'auto';

// ── 保存 ──────────────────────────────────────────────────────────
// 手机上"下载"和桌面上完全不是一回事，一个 a.click 走天下会翻车：
//   · iOS Safari：a[download] 对 blob URL 不可靠（WebKit 老 bug 190351）；
//     想让图进相册，只有「分享 → 存储图像」和长按图片两条路
//   · Android WebView：宿主没注册 DownloadListener 的话 a[download] 静默失效，
//     而且 navigator.share 在里面压根不存在
//   · File System Access API 只有 Chromium 桌面有，iOS 完全没有
// 所以三档降级：分享 → 选目录 → a[download]，外加一条长按退路。

const CRC_T = (() => {
  const t = new Int32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();
function crc32(u8){
  let c = -1;
  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}
/**
 * ⚠ 顺序不能反：必须**先把读端挂上**再写。
 *   写成「write → close → 再读 readable」，压缩输出一超过 readable 的队列水位，
 *   close() 就永远等不到人把数据取走 —— 整个保存流程静默挂死（实测踩过）。
 *   再加一道超时兜底：真挂了也得把文件原样存出去，不能因为压缩把导出废掉。
 */
async function deflateRaw(u8){
  if (typeof CompressionStream === 'undefined') return null;
  try {
    const cs = new CompressionStream('deflate-raw');
    const drained = new Response(cs.readable).arrayBuffer();   // 先挂读端
    const w = cs.writable.getWriter();
    await w.write(u8);
    await w.close();
    const buf = await Promise.race([
      drained,
      new Promise((_, rej) => setTimeout(() => rej(new Error('压缩超时')), 3000)),
    ]);
    return new Uint8Array(buf);
  } catch (e) { return null; }
}
/**
 * 打成一个 zip。拍照出三个文件（照片 + scene.json + 立绘层 PNG），
 * 在手机上分三次存要点三次、iOS 还会拦后面的，所以一律打包。
 * 时间戳写死 1980-01-01，同样的输入永远出同样的字节。
 */
async function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let off = 0;
  for (const f of files){
    const raw = new Uint8Array(await f.blob.arrayBuffer());
    const def = await deflateRaw(raw);
    const body = def || raw;
    const method = def ? 8 : 0;
    const nm = enc.encode(f.name);
    const crc = crc32(raw);

    const lh = new Uint8Array(30 + nm.length);
    const d = new DataView(lh.buffer);
    d.setUint32(0, 0x04034b50, true);
    d.setUint16(4, 20, true);
    d.setUint16(6, 0x0800, true);          // 文件名按 UTF-8 解
    d.setUint16(8, method, true);
    d.setUint16(10, 0, true); d.setUint16(12, 0x21, true);
    d.setUint32(14, crc, true);
    d.setUint32(18, body.length, true);
    d.setUint32(22, raw.length, true);
    d.setUint16(26, nm.length, true);
    lh.set(nm, 30);
    parts.push(lh, body);

    const ch = new Uint8Array(46 + nm.length);
    const c = new DataView(ch.buffer);
    c.setUint32(0, 0x02014b50, true);
    c.setUint16(4, 20, true); c.setUint16(6, 20, true);
    c.setUint16(8, 0x0800, true);
    c.setUint16(10, method, true);
    c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true);
    c.setUint32(20, body.length, true);
    c.setUint32(24, raw.length, true);
    c.setUint16(28, nm.length, true);
    c.setUint32(42, off, true);
    ch.set(nm, 46);
    central.push(ch);
    off += lh.length + body.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array(22);
  const e = new DataView(eocd.buffer);
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, files.length, true);
  e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true);
  e.setUint32(16, off, true);
  return new Blob([...parts, ...central, eocd], { type: 'application/zip' });
}

/**
 * 回执 + 长按退路。
 * iOS 上这一条不是"补充"，是**主路径**：分享能不能弹出来取决于
 * 瞬时用户激活还剩多少，弹不出来的时候只剩长按。
 */
let lastPreview = null;
function saveNote(msg, imgUrl){
  const el = $('saveNote');
  if (!el) return;
  if (lastPreview && lastPreview !== imgUrl){
    try { URL.revokeObjectURL(lastPreview); } catch (e) {}
    lastPreview = null;
  }
  el.innerHTML = '';
  if (msg) el.appendChild(document.createTextNode(msg));
  if (imgUrl){
    lastPreview = imgUrl;
    const im = document.createElement('img');
    im.src = imgUrl;
    im.style.cssText = 'max-width:100%;border-radius:8px;margin-top:8px;display:block';
    el.appendChild(im);
    const tip = document.createElement('div');
    tip.style.cssText = 'color:#ffb457;margin-top:6px';
    tip.textContent = t('note.longPress');
    el.appendChild(tip);
  }
  el.style.display = (msg || imgUrl) ? '' : 'none';
}

/** 保存结果的回执文案。存的是 TXT 的 key，取的时候才翻（切语言立刻跟着变） */
const SAVED = { share:'note.savedShare', picker:'note.savedPicker',
                download:'note.savedDownload', cancel:'note.savedCancel' };
/** 存一个文件：分享 → 选目录 → a[download] 三档 */
async function saveBlob(blob, filename){
  let file = null;
  try { file = new File([blob], filename, { type: blob.type || 'application/octet-stream' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file] }); return 'share'; }
    catch (e){ if (e && e.name === 'AbortError') return 'cancel'; }
  }
  if (window.showSaveFilePicker){
    try {
      const h = await window.showSaveFilePicker({ suggestedName: filename });
      const w = await h.createWritable();
      await w.write(blob);
      await w.close();
      return 'picker';
    } catch (e){ if (e && e.name === 'AbortError') return 'cancel'; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  return 'download';
}

/** 多文件打包再存 */
async function saveAll(files, zipName, previewUrl){
  const many = files.length > 1;
  const blob = many ? await zipStore(files) : files[0].blob;
  const name = many ? zipName : files[0].name;
  let r = 'download';
  try { r = await saveBlob(blob, name); } catch (e){ r = 'download'; }
  const lbl = t(SAVED[r] || 'note.savedCancel');
  // 分享/选目录成功就不摆长按退路了；其余情况一律摆上
  saveNote(many ? t('note.savedMany', lbl, name, files.length) : t('note.savedOne', lbl, name),
           (r === 'share' || r === 'picker') ? null : previewUrl);
  return r;
}

// ── 拍照：快门直出一张照片；三件套挪到「导出素材包」────────────────
/**
 * 出图的合成画布：**先铺视频帧，再把立绘叠上去**，按取景框裁好。
 * ⚠ 这一页的 canvas（#c）是**透明浮层** —— 视频是它下面的 <video> 元素。
 *   直接 cv.toDataURL() 拿到的是浮层自己（空的），必须另起一块离屏画布重画。
 *   取景器和出图都走 drawCharTo()，所以照片里的立绘和眼睛看到的分毫不差。
 */
function buildShotCanvas(){ return composeShot(v); }

/**
 * 出图那一遍变换的**唯一一份实现**：拍两张图跑的都是它。
 *   src = <video>  → 照片（视频帧打底 + 立绘）
 *   src = null     → 立绘层（**只有立绘 + 它自己的 alpha**）
 * ⚠ 抽出来就是为了"同一个坐标系、同一个裁切框"这条：frameRect / drawCharTo /
 *   裁切偏移只要有一处在这条路上，两张图就必然严丝合缝 —— 复制粘贴两套迟早改漏一处。
 *   src=null 这条路上**没有**视频帧、没有地面网格、没有地平线、没有人体骨架，
 *   也没有取景框压暗和三分线 —— 那些只在实时预览的 draw() 里画，出不来的。
 */
function composeShot(src){
  const R = frameRect();
  const full = document.createElement('canvas');
  full.width = cv.width; full.height = cv.height;
  const g = full.getContext('2d');
  if (src && src.videoWidth) g.drawImage(src, 0, 0, cv.width, cv.height);
  drawCharTo(g);
  const off = document.createElement('canvas');
  off.width  = Math.max(1, Math.round(R.w));
  off.height = Math.max(1, Math.round(R.h));
  // 同一个裁切框、同一个（可能是小数的）偏移 —— 两张图的像素就此一一对应
  off.getContext('2d').drawImage(full, -R.x, -R.y);
  return { canvas: off, rect: R };
}

/**
 * 立绘层：和照片**同一个坐标系、同一个裁切框**，只是不铺视频帧。
 * 直接盖在 shot_*.jpg 上就是严丝合缝的 —— 摆位、裁切、贴地模式的倾角都已经烘进去了，
 * 所以它**不是**原始立绘文件，下游拿到不用再算一遍偏移。
 * 尺寸和 shot_*.jpg 逐像素相同（都是 frameRect 圆整后的那个矩形）。
 */
function buildCharCanvas(){ return composeShot(null); }

/**
 * canvas → Blob。一次要出两张图，回调套回调就成金字塔了，包成 Promise。
 * 编码失败（极端内存）回 null，由调用方决定降级 —— 不能把整张照片一起废掉。
 */
const toBlobP = (c, type, q) => new Promise(res => {
  try { c.toBlob(b => res(b || null), type, q); } catch (e){ res(null); }
});

/**
 * 文件名里的时间戳。一个包里几个文件共用**同一个** stamp（同一个时刻取的），
 * 少一个字符解压出来就对不上号。
 */
const newStamp = () => new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);

/**
 * 配方（scene.json）。照片之外的几何数据，下游照着它才能把立绘摆回同一个位置。
 * 快门不需要它 —— 只有素材包要。
 */
function buildScene(R, pc){
  return {
    version: 1,
    image: { width: Math.round(R.w), height: Math.round(R.h), file: 'shot.jpg' },
    // 出图范围。source 是裁切前的整屏尺寸，下游按同一套重算才不会错位。
    frame: {
      aspect: S.frame,
      crop: [Math.round(R.x), Math.round(R.y), Math.round(R.w), Math.round(R.h)],
      source: { width: cv.width, height: cv.height },
    },
    camera: {
      focalPx: +focal().toFixed(2),
      focal35mm: S.feq,
      pitchDeg: +S.pitch.toFixed(3),
      rollDeg:  +S.roll.toFixed(3),
      heightM:  S.h,
    },
    subject: {
      heightM: S.Hp,
      distanceM: +S.d.toFixed(3),
      lateralM:  +S.x.toFixed(3),
      footPixel: project(S.x, -S.h, S.d),
      headPixel: project(S.x, S.Hp - S.h, S.d),
    },
    ground: { y: 0, normal: [0, 1, 0] },
    // 景别：这张立绘从人身上哪一段切的。**新加的 key**，已有字段的名字和值
    // 一个都没动 —— 下游不看它也能读，看了才知道贴地时下沿为什么不在 y=0。
    shot: S.shot,
    // 纯大小系数：贴着地时乘在投影跨度上，锚点在下沿那个点。
    // 下游要按同一套复原，就得把它乘回去（character.sizePixel 里已经乘过了，
    // 这一项是留给"想换个数重算"的人）。**新 key**。
    charScale: S.charScale,
    // 框条吸附（自由模式）。和 studio.html 的 edge 段同形：bar 是编号 0~4，
    // rotationLocked 明说"吸附时旋转被锁成 0" —— 下游不用去猜。**新 key**。
    edge: { bar: S.edgeBar, rotationLocked: !!S.edgeBar },
    // 立绘落位。没选立绘就是 null —— 下游别当成"有立绘但位置是 0"。
    character: (pc && chCanvas) ? {
      name: chName,
      mode: S.mode,                                  // 'ground' | 'free'
      image: { width: chCanvas.width, height: chCanvas.height },
      centerPixel: [+pc.u.toFixed(2), +pc.v.toFixed(2)],
      sizePixel: [+pc.w.toFixed(2), +pc.h.toFixed(2)],
      rotationDeg: +(pc.rot*R2D).toFixed(3),
    } : null,
  };
}

/**
 * 快门 = 相机：按一下，得到**一张照片**。
 * 用户原话「能不能直接下照片呢，不用下一个压缩包了」—— 所以这里走 saveBlob
 * 单文件，**不打包**。配方和立绘层不再跟着快门走，想要三件套去面板底部
 * 的「导出素材包」（zipStore / saveAll 一个字没动，只是调用点变了）。
 */
$('shot').addEventListener('click', async () => {
  // 按取景框裁切：出图必须和眼睛在框里看到的完全一致。
  // 不裁的话，画面边缘那些"框外已经压暗"的部分会跟着一起出来。
  let shotCv;
  try { shotCv = buildShotCanvas().canvas; }   // 立绘读脏了画布也不能把出图废掉
  catch (e){ saveNote(t('note.shotFail'), null); return; }
  const name = `shot_${newStamp()}.jpg`;
  try {
    const b = await toBlobP(shotCv, 'image/jpeg', 0.95);
    if (!b){ saveNote(t('note.shotFail'), null); return; }
    let r = 'download';
    try { r = await saveBlob(b, name); } catch (e){ r = 'download'; }
    // 回执点名文件本身：用户才知道存下来的是什么、叫什么
    const lbl = t(SAVED[r] || 'note.savedCancel');
    saveNote(t('note.savedOne', lbl, name),
             (r === 'share' || r === 'picker') ? null : URL.createObjectURL(b));
  } catch (e){ saveNote(t('note.shotFail'), null); }
});

/**
 * 导出素材包：照片 + 配方 + 立绘层，**三个文件打一个 zip**。
 * 手机上分三次存要点三次、iOS 还会拦后面的，所以这一包仍然打包。
 */
$('exPack').addEventListener('click', async () => {
  const R = frameRect();
  let shotCv, charCv = null;
  try {
    shotCv = buildShotCanvas().canvas;
    // 立绘层：同一套变换再跑一遍，只把视频帧去掉（src=null）。
    // 没立绘 —— 或贴地模式下人跑到相机后面、project 返回 null —— 就没有这一层，
    // 也就不出这个文件：宁可不给，也不给一张全透明的空图。
    if (chCanvas && currentPlacement()) charCv = buildCharCanvas().canvas;
  } catch (e){ saveNote(t('note.shotFail'), null); return; }
  const scene = buildScene(R, currentPlacement());

  // ⚠ 三个文件共用**同一个** stamp（同一个时刻取的），少一个字符解压出来就对不上号
  const stamp = newStamp();
  try {
    const b = await toBlobP(shotCv, 'image/jpeg', 0.95);
    if (!b){ saveNote(t('note.shotFail'), null); return; }
    const json = new Blob([JSON.stringify(scene, null, 2)], { type: 'application/json' });
    const files = [{ name: `shot_${stamp}.jpg`, blob: b },
                   { name: `scene_${stamp}.json`, blob: json }];
    if (charCv){
      // ⚠ 必须 PNG：JPEG 没有 alpha 通道，立绘层会被填成实心方块，
      //   盖回照片上就是一块补丁 —— 这一层存在的全部意义就是那张 alpha。
      const cb = await toBlobP(charCv, 'image/png');
      if (cb) files.push({ name: `character_${stamp}.png`, blob: cb });
    }
    const preview = URL.createObjectURL(b);
    await saveAll(files, `arcam_${stamp}.zip`, preview);
  } catch (e){ saveNote(t('note.shotFail'), null); }
});

// ── 真·相机变焦 ───────────────────────────────────────────────────
/**
 * 拿 track.getCapabilities().zoom 生成常驻条上那一格。
 * ⚠ iOS Safari **没有** caps.zoom —— 这一格就整格消失。那是预期行为，不是坏了。
 * ⚠ min / max / step 各机型差异极大，全部按设备报的来，一个都不许写死。
 * ⚠ 有些机型根本不接受 advanced:[{zoom}]，会抛 OverconstrainedError 或者
 *   干脆静默不认。所以必须 catch：失败就把滑块禁用 + 摆一句提示，
 *   别让它看着能用、实际怎么拖画面都不动。
 */
function setupZoom(track){
  if (!track || typeof track.getCapabilities !== 'function') return;   // 不支持 → 保持隐藏
  let z = null;
  try { z = (track.getCapabilities() || {}).zoom; } catch (e) { return; }
  if (!z || typeof z.min !== 'number' || typeof z.max !== 'number' || z.max <= z.min) return;

  const el = $('lvZoom'), out = $('olvZoom'), cell = $('lvZoomCell'), note = $('lvZoomNote');
  const fmt = n => n.toFixed(1) + '×';
  el.min = z.min;
  el.max = z.max;
  el.step = (typeof z.step === 'number' && z.step > 0) ? z.step : (z.max - z.min)/100;
  let cur = z.min;
  try { const s = track.getSettings(); if (s && typeof s.zoom === 'number') cur = s.zoom; } catch (e) {}
  el.value = cur;
  out.textContent = fmt(cur);
  cell.style.display = '';                 // ← 有 zoom 才让它出现

  el.addEventListener('input', () => {
    const val = parseFloat(el.value);
    out.textContent = fmt(val);            // 读数先跟上，别等应用成功了字才动
    try {
      const p = track.applyConstraints({ advanced: [{ zoom: val }] });
      if (p && typeof p.catch === 'function') p.catch(() => zoomFail(el, note));
    } catch (e){ zoomFail(el, note); }
  });
}
/** 变焦应用失败：禁用滑块 + 一句提示（走 t()，切语言跟着变） */
function zoomFail(el, note){
  if (el.disabled) return;                 // 只降级一次
  el.disabled = true;
  el.dataset.tTitle = 'live.zoomFail';
  el.title = t('live.zoomFail');
  note.textContent = t('live.zoomFail');
  note.style.display = '';
}

// ── 启动 ──────────────────────────────────────────────────────────
async function start() {
  $('gateMsg').textContent = t('gate.opening');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } },
      audio: false,
    });
    v.srcObject = stream;
    await v.play();

    // 摄像头已经跑起来了，再挂变焦 —— 拿不到 caps.zoom 的话这一格就保持隐藏
    setupZoom(stream.getVideoTracks()[0]);

    // 请求传感器权限（iOS 需要，Android 直接给）
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }
    window.addEventListener('deviceorientation', onOrient, true);

    // 让 canvas 精确覆盖在 video 上，且内部坐标系 = 视频像素坐标
    const fit = () => {
      const w = v.videoWidth, h = v.videoHeight;
      if (!w) return;
      // cover：铺满整屏，多出来的两边裁掉。用 min 就是 letterbox，
      // 上下（或左右）两条黑边既浪费屏幕，也让人误判取景范围。
      // ⚠ 用**物理视口**（innerWidth × innerHeight），不是逻辑视口。
      //   世界层在 syncTurn 里被 rotate(-TURN) 抵消回了"没转屏"的姿态，
      //   它的画幅要铺满的是**玻璃**，不是转过来的逻辑框 ——
      //   用 VW()/VH()（宽高互换）会让横屏下画布按 844×390 去 cover，
      //   反着转回来就只有中间一条，四周露黑。
      const sc = Math.max(innerWidth/w, innerHeight/h);
      for (const el of [v, cv]) {
        el.style.width = (w*sc)+'px'; el.style.height = (h*sc)+'px';
      }
      cv.width = w; cv.height = h;
      S.ready = true; resnap(); draw();      // 画布尺寸变了，贴边按新框重算
      // 选择器是骑在常驻条 + 把手上面算出来的，转屏/键盘弹出把它顶掉了就重摆一次
      if (!$('kind').hidden) showKind();
    };
    v.addEventListener('loadedmetadata', fit);
    addEventListener('resize', fit);
    if (v.videoWidth) fit();

    $('gate').style.display = 'none';
  } catch (err) {
    $('gateMsg').innerHTML = t('gate.fail', err.name, err.message);
  }
}
$('gateBtn').addEventListener('click', start);

// 横竖屏切换：resize 那一条已经挂了 fit()，这里再补一次重画 ——
// 有的浏览器转屏只发 orientationchange 不一定发 resize，
// 而 roll 的补偿（onOrient 里读 screen.orientation.angle）要下一帧才追上。
if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', () => {
    setTimeout(() => { if (S.ready) draw(); }, 60);
  });
}

/**
 * 拍照之后画面冻住 —— 恢复。
 *
 * 真机原话：「拍完之后需要刷新一下，重进浏览器，不然它会卡住，
 *   摄像头读取不了新的，只会卡住一个画面」。
 * 出图那条路会走 navigator.share 弹系统分享面板（安卓/iOS 都是），
 * 面板一弹页面就被挂起，回来时浏览器把 <video> 停了 —— 元素还在、流也还在，
 * 就是不再解码新帧，看着就是"卡住一张"。play() 一下就好，不用重新 getUserMedia。
 *
 * ⚠ 三种时机都得挂：切回前台（visibilitychange）、重新拿到焦点（focus）、
 *   从缓存里恢复（pageshow，iOS 的 bfcache 走这条）。
 */
function resumeCam(){
  if (document.hidden || !S.ready) return;
  // 已经停了的才 play（play 一个正在播的元素是无害的 no-op，但没必要）
  if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  draw();                       // 顺手补一帧，别停在分享面板弹出前那一张上
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeCam(); });
addEventListener('focus', resumeCam);
addEventListener('pageshow', resumeCam);

/**
 * 软转屏之后 <input type=range> 拖不动 —— 自己接管拖动。
 *
 * 真机原话：「为什么横屏切换，焦距和其他的那么困难，拉不动啊，竖屏就没有这个担忧」。
 * 原因：滑条在 body 里、body 被 rotate(±90) 了，浏览器**命中测试**是对的（手指能按住），
 * 但它内部算拖动增量仍按**屏幕坐标**来 —— 90° 时手指横着划、它按纵向量，
 * 差值几乎为 0，看着就是"按住不掉、但怎么划都不动"。竖屏 TURN=0 不涉及，所以只有横屏有。
 *
 * 做法：把手指位置投影到滑条的**局部长轴**上，直接算 0..1 再写 value。
 *   局部 +x（值变大的方向）在物理屏幕上指向哪，由 TURN 决定：
 *     TURN > 0 → 物理向下    TURN < 0 → 物理向上    TURN = 0 → 物理向右
 * 只在 TURN≠0 时接管；没转屏就 return，原生拖动照旧（别把好的也抢了）。
 */
function rotSafeRange(el){
  const setFrom = ev => {
    const r = el.getBoundingClientRect();
    let t = TURN > 0 ? (ev.clientY - r.top) / r.height
          : TURN < 0 ? 1 - (ev.clientY - r.top) / r.height
          :            (ev.clientX - r.left) / r.width;
    t = Math.max(0, Math.min(1, t));
    const mn = +el.min || 0, mx = +el.max || 100, st = +el.step;
    let v = mn + (mx - mn) * t;
    if (st > 0) v = Math.round(v / st) * st;
    v = Math.max(mn, Math.min(mx, v));
    if (+el.value !== v){ el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); }
  };
  el.addEventListener('pointerdown', e => {
    if (!TURN) return;                       // 竖屏交给原生
    e.preventDefault(); e.stopPropagation(); // 挡掉原生那套按屏幕坐标算的拖动
    try { el.setPointerCapture(e.pointerId); } catch (_){}
    setFrom(e);
    const mv = e2 => { e2.preventDefault(); setFrom(e2); };
    const up = () => {
      el.removeEventListener('pointermove', mv);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
    };
    el.addEventListener('pointermove', mv);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }, { passive: false });
}
for (const el of document.querySelectorAll('input[type=range]')) rotSafeRange(el);

// ── 语言开关 ──────────────────────────────────────────────────────
/**
 * 把整页文案刷成当前语言。
 *   · [data-t]        → textContent（HTML 里保留中文原文，单看 HTML 仍然可读）
 *   · [data-t-title]  → title 属性
 *   · [data-t-ph]     → placeholder 属性（现在没有，留着给以后加输入框）
 * 画幅按钮是 JS 生成的，得重画一遍；HUD 是每帧拼的，再画一帧就跟着变了。
 */
function applyLang(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.title = t('app.title');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-t-title]').forEach(el => { el.title = t(el.dataset.tTitle); });
  document.querySelectorAll('[data-t-ph]').forEach(el => { el.placeholder = t(el.dataset.tPh); });
  const lb = $('lang');
  lb.textContent = LANG === 'en' ? '中' : 'EN';    // 按钮显示的是「切过去会变成什么」
  lb.title = t('lang.switch');
  renderFrameRow();
  renderShotRow();              // 景别按钮也是 JS 生成的
  renderEdgeRow();              // 框条按钮也是 JS 生成的
  renderChRow();                // 缩略条是 JS 生成的，也得重画
  syncModeRow();
  syncLive();                   // 常驻条的标签可能刚换了 key，读数也得按新语言重排
  const tip = $('tip');         // 提示正露着的话，文案也跟着语言换（不重启它的倒计时）
  if (tip && !tip.hidden) tip.textContent = t(tipKey());
  if (S.ready) draw();          // 没 ready 的话 HUD 就停在 data-t 那条「初始化…」上
}
$('lang').onclick = () => {
  LANG = LANG === 'en' ? 'zh' : 'en';
  // 手动切才写盘；?lang= 参数只影响这一次加载，不碰这里
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e){}
  applyLang();
};

applyLang();
syncLive();          // 面板里的 bind() 早就把 S 填好了，让常驻条照着它先摆一次
</script>
</body>
</html>
